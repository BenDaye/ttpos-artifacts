services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: faynosync-prod-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - faynosync-prod

networks:
  faynosync-prod:
    external: true
    name: ttpos-releases_faynosync-prod
