services:
  api:
    image: ghcr.io/bendaye/ttpos-artifacts/faynosync-server:latest
    container_name: faynosync-api
    volumes:
      - ./gcs-credentials.json:/app/credentials.json:ro
    restart: unless-stopped
    ports:
      - "${API_PORT:-9000}:9000"
    environment:
      - GIN_MODE=release
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - faynosync
      - caddy-net

  dashboard:
    image: ghcr.io/bendaye/ttpos-artifacts/faynosync-dashboard-next:latest
    platform: linux/amd64
    container_name: faynosync-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - VITE_API_URL=${API_URL:-http://localhost:9000}
      - VITE_PORT=${VITE_PORT:-3000}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-localhost}
    depends_on:
      - api
    networks:
      - faynosync
      - caddy-net

  db:
    image: mongo:7
    container_name: faynosync-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    volumes:
      - ./volumes/mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - faynosync

  cache:
    image: redis:7-alpine
    container_name: faynosync-cache
    restart: unless-stopped
    command: redis-server --save 20 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ./volumes/redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - faynosync

networks:
  faynosync:
    driver: bridge
  caddy-net:
    external: true
