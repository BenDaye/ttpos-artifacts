services:
  api:
    image: ghcr.io/bendaye/ttpos-artifacts/faynosync-server:latest
    container_name: faynosync-api
    volumes:
      - ./gcs-credentials.json:/app/credentials.json:ro
      - ./short-latest.json:/app/short-latest.json:ro
    restart: unless-stopped
    ports:
      - "${API_PORT:-9000}:9000"
    environment:
      - GIN_MODE=release
      - SHORT_LATEST_CONFIG=/app/short-latest.json
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - faynosync
      - caddy-net

  dashboard:
    image: ghcr.io/bendaye/ttpos-artifacts/faynosync-dashboard-next:latest
    platform: linux/amd64
    container_name: faynosync-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - VITE_API_URL=${API_URL:-http://localhost:9000}
      - VITE_PORT=${VITE_PORT:-3000}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-localhost}
    depends_on:
      - api
    networks:
      - faynosync
      - caddy-net

  mcp:
    image: ghcr.io/bendaye/ttpos-artifacts/faynosync-mcp:latest
    platform: linux/amd64
    container_name: faynosync-mcp
    restart: unless-stopped
    # 不发布 host 端口：仅经 caddy-net 由 Caddy 反代访问（faynosync-mcp:3010）。
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=3010
      # 走 compose 内网直连 API，不出公网
      - API_BASE_URL=${MCP_API_BASE_URL:-http://api:9000}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-update.ttpos.dev}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
    # MCP_HTTP_AUTH_TOKEN（客户端 bearer）与 API_TOKEN（上游 fns_）来自 .env，不入库
    env_file:
      - .env
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3010/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - faynosync
      - caddy-net

  db:
    image: mongo:7
    container_name: faynosync-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    volumes:
      - ./volumes/mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - faynosync

  cache:
    image: redis:7-alpine
    container_name: faynosync-cache
    restart: unless-stopped
    command: redis-server --save 20 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ./volumes/redis_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - faynosync

networks:
  faynosync:
    driver: bridge
  caddy-net:
    external: true
