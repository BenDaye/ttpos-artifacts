name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "构建分支 (e.g. release, new-test, feature/xxx)"
        required: true
        type: string
        default: "new-test"
      env:
        description: "选择构建环境"
        required: true
        type: choice
        options:
          - "prod"
          - "test"
          - "dev"
        default: "test"
      package:
        description: "选择要构建的应用端"
        required: true
        type: choice
        options:
          - all
          - pos
          - kds
          - shop
          - assistant
          - tablet
          - qds
          - kiosk
        default: "all"
      base_url:
        description: "选择API基础URL"
        required: true
        type: choice
        default: "https://ttpos-test1.ttpos.com/api/v1"
        options:
          - "https://ttpos-test1.ttpos.com/api/v1"
          - "https://api.ttpos.com/api/v1"
          - "https://ttpos-pro.keli.vip/api/v1"
      base_ws_url:
        description: "选择WebSocket基础URL"
        required: true
        type: choice
        default: "wss://ttpos-test1.ttpos.com/ws"
        options:
          - "wss://ttpos-test1.ttpos.com/ws"
          - "wss://api.ttpos.com/ws"
          - "wss://ttpos-pro.keli.vip/ws"
      updater_url:
        description: "自定义更新服务URL (覆盖 UPDATER_URL)"
        required: false
        type: string
      updater_owner:
        description: "自定义更新服务Owner (覆盖 UPDATER_OWNER)"
        required: false
        type: string
      updater_channel:
        description: "自定义更新频道 (覆盖 UPDATER_CHANNEL)"
        required: false
        type: choice
        options:
          - ""
          - "prod"
          - "test"
          - "dev"
      scp:
        description: "是否启用SCP传输"
        required: true
        default: "off"
        type: choice
        options:
          - "on"
          - "off"
      faynosync:
        description: "FaynoSync 上传模式 (on=检查版本已存在则跳过, force=强制覆盖)"
        required: false
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
          - "force"
      update_cms:
        description: "是否更新 CMS 下载页"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [pos, kds, shop, assistant, tablet, qds, kiosk]
        include:
          - package: pos
            apk_name: TTPOS-Cashier
            scp_folder: Cashier
            faynosync_name: "TTPOS"
            cms_title: "Cashier"
          - package: assistant
            apk_name: TTPOS-Assistant
            scp_folder: Assistant
            faynosync_name: "TTPOS Go"
            cms_title: "Assistant"
          - package: kds
            apk_name: TTPOS-Kitchen
            scp_folder: Kitchen
            faynosync_name: "TTPOS Kitchen"
            cms_title: "KDS Kitchen"
          - package: tablet
            apk_name: TTPOS-Menu
            scp_folder: Menu
            faynosync_name: "TTPOS Menu"
            cms_title: "Tablet Menu"
          - package: shop
            apk_name: TTPOS-Shop
            scp_folder: Shop
            faynosync_name: "TTPOS Shop"
            cms_title: "Shop"
          - package: qds
            apk_name: TTPOS-Queue
            scp_folder: Qds
            faynosync_name: "TTPOS Queue"
            cms_title: ""
          - package: kiosk
            apk_name: TTPOS-Kiosk
            scp_folder: Kiosk
            faynosync_name: "TTPOS Kiosk"
            cms_title: ""
    env:
      APK_OUTPUT_PATH: releases
      SCP_S_PATH: ${{ inputs.branch == 'release' && format('/hitosea/ttpos-apk/Prod/{0}/', matrix.package) || format('/hitosea/ttpos-apk/Test/{0}/', matrix.package) }}
      SCP_D_PATH: ${{ inputs.branch == 'release' && format('/root/web/web/restant/out/downloads/{0}/', matrix.scp_folder) || format('/root/web/web/restant/out/downloads/Test/{0}/', matrix.scp_folder) }}
    steps:
      - name: 检查是否需要构建此应用端
        id: check
        run: |
          if [ "${{ inputs.package }}" = "all" ] || [ "${{ inputs.package }}" = "${{ matrix.package }}" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "跳过 ${{ matrix.package }} (选择的应用端: ${{ inputs.package }})"
          fi

      - name: 显示构建信息
        if: steps.check.outputs.should_run == 'true'
        run: |
          echo "========================================="
          echo "构建信息"
          echo "========================================="
          echo "应用端: ${{ matrix.package }}"
          echo "分支: ${{ inputs.branch }}"
          echo "环境: ${{ inputs.env }}"
          echo "API URL: ${{ inputs.base_url }}"
          echo "WebSocket URL: ${{ inputs.base_ws_url }}"
          echo "SCP传输: ${{ inputs.scp }}"
          echo "========================================="

      - name: Checkout the code
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          repository: innet8/ttpos-flutter
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.branch }}

      - name: Set up Flutter
        if: steps.check.outputs.should_run == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: "3.41.2"

      - name: 配置 MELOS_SDK_PATH
        if: steps.check.outputs.should_run == 'true'
        shell: bash
        run: echo "MELOS_SDK_PATH=$(dirname "$(dirname "$(which flutter)")")" >> "$GITHUB_ENV"

      - name: Install Melos
        if: steps.check.outputs.should_run == 'true'
        run: |
          flutter --version
          dart pub global activate melos

      - name: Set up JDK
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Melos Init
        if: steps.check.outputs.should_run == 'true'
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
        run: |
          melos bs
          melos run env:setup -- --env=${{ inputs.env }} --file=${{ inputs.env }}

      - name: 生成环境变量文件
        if: steps.check.outputs.should_run == 'true'
        env:
          API_URL: ${{ inputs.base_url }}
          WS_URL: ${{ inputs.base_ws_url }}
          UPDATER_URL: ${{ inputs.updater_url }}
          UPDATER_OWNER: ${{ inputs.updater_owner }}
          UPDATER_CHANNEL: ${{ inputs.updater_channel }}
        run: |
          # 根据 env 输入选择对应的环境文件(与 scripts/utils.dart getEnv() 保持一致)
          case "${{ inputs.env }}" in
            dev)  ENV_SUFFIX="development" ;;
            test) ENV_SUFFIX="test" ;;
            *)    ENV_SUFFIX="production" ;;
          esac

          ENV_PATH="apps/${{ matrix.package }}/.env.${ENV_SUFFIX}.local"
          ENV_TEMPLATE="apps/${{ matrix.package }}/.env.${ENV_SUFFIX}"

          if [ ! -f "$ENV_PATH" ]; then
            if [ -f "$ENV_TEMPLATE" ]; then
              cp "$ENV_TEMPLATE" "$ENV_PATH"
            else
              touch "$ENV_PATH"
            fi
          fi

          sed -i "s|^API_BASE_URL=.*|API_BASE_URL=${API_URL}|" "$ENV_PATH"
          sed -i "s|^WS_BASE_URL=.*|WS_BASE_URL=${WS_URL}|" "$ENV_PATH"

          if [ -n "$UPDATER_URL" ]; then
            sed -i "s|^UPDATER_URL=.*|UPDATER_URL=${UPDATER_URL}|" "$ENV_PATH"
            grep -q "^UPDATER_URL=" "$ENV_PATH" || echo "UPDATER_URL=${UPDATER_URL}" >> "$ENV_PATH"
          fi
          if [ -n "$UPDATER_OWNER" ]; then
            sed -i "s|^UPDATER_OWNER=.*|UPDATER_OWNER=${UPDATER_OWNER}|" "$ENV_PATH"
            grep -q "^UPDATER_OWNER=" "$ENV_PATH" || echo "UPDATER_OWNER=${UPDATER_OWNER}" >> "$ENV_PATH"
          fi
          if [ -n "$UPDATER_CHANNEL" ]; then
            sed -i "s|^UPDATER_CHANNEL=.*|UPDATER_CHANNEL=${UPDATER_CHANNEL}|" "$ENV_PATH"
            grep -q "^UPDATER_CHANNEL=" "$ENV_PATH" || echo "UPDATER_CHANNEL=${UPDATER_CHANNEL}" >> "$ENV_PATH"
          fi

          # 保存 ENV_SUFFIX 供后续步骤使用
          echo "ENV_SUFFIX=$ENV_SUFFIX" >> $GITHUB_ENV

          echo "--- 环境变量文件内容 ($ENV_PATH) ---"
          cat "$ENV_PATH"

      - name: 设置 SENTRY_DSN(仅 release 分支)
        if: steps.check.outputs.should_run == 'true' && inputs.branch == 'release'
        env:
          SENTRYDSN_POS: ${{ secrets.SENTRYDSN_POS }}
          SENTRYDSN_KDS: ${{ secrets.SENTRYDSN_KDS }}
          SENTRYDSN_ASSISTANT: ${{ secrets.SENTRYDSN_ASSISTANT }}
          SENTRYDSN_TABLET: ${{ secrets.SENTRYDSN_TABLET }}
          SENTRYDSN_SHOP: ${{ secrets.SENTRYDSN_SHOP }}
          SENTRYDSN_QDS: ${{ secrets.SENTRYDSN_QDS }}
          SENTRYDSN_KIOSK: ${{ secrets.SENTRYDSN_KIOSK }}
        run: |
          ENV_PATH="apps/${{ matrix.package }}/.env.${{ env.ENV_SUFFIX }}.local"
          case "${{ matrix.package }}" in
            pos)       DSN="$SENTRYDSN_POS" ;;
            assistant) DSN="$SENTRYDSN_ASSISTANT" ;;
            tablet)    DSN="$SENTRYDSN_TABLET" ;;
            kds)       DSN="$SENTRYDSN_KDS" ;;
            shop)      DSN="$SENTRYDSN_SHOP" ;;
            qds)       DSN="$SENTRYDSN_QDS" ;;
            kiosk)     DSN="$SENTRYDSN_KIOSK" ;;
          esac
          sed -i "s|^SENTRY_DSN=.*|SENTRY_DSN=${DSN}|" "$ENV_PATH"

      - name: 设置环境变量
        if: steps.check.outputs.should_run == 'true'
        run: |
          version=$(awk '/version:/ {print $2}' apps/${{ matrix.package }}/pubspec.yaml | cut -d'+' -f1)
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "VERSION_APK=${{ matrix.apk_name }}-V${version}.apk" >> $GITHUB_ENV
          echo "LATEST_NAME=${{ matrix.apk_name }}-latest.apk" >> $GITHUB_ENV

          case "${{ inputs.env }}" in
            prod) echo "FS_VERSION=${version}" >> $GITHUB_ENV ;;
            dev)  echo "FS_VERSION=${version}.800" >> $GITHUB_ENV ;;
            *)    echo "FS_VERSION=${version}.900" >> $GITHUB_ENV ;;
          esac

      - name: 检查 FaynoSync 版本是否已存在
        if: steps.check.outputs.should_run == 'true' && inputs.faynosync == 'on'
        env:
          FAYNOSYNC_URL: ${{ secrets.FAYNOSYNC_URL }}
        run: |
          if [ -z "$FAYNOSYNC_URL" ]; then
            echo "::warning::未配置 FAYNOSYNC_URL，跳过 FaynoSync 版本检查"
            exit 0
          fi

          APP_NAME="${{ matrix.faynosync_name }}"
          CHANNEL="${{ inputs.env }}"
          CHECK_VERSION="${{ env.FS_VERSION }}"
          PLATFORM="android"
          ARCH="arm64"

          echo "检查 FaynoSync: ${APP_NAME} v${CHECK_VERSION} (${CHANNEL}/${PLATFORM}/${ARCH})"

          RESP=$(curl -s --max-time 10 -G "${FAYNOSYNC_URL}/checkVersion" \
            --data-urlencode "app_name=${APP_NAME}" \
            --data-urlencode "version=${CHECK_VERSION}" \
            --data-urlencode "channel=${CHANNEL}" \
            --data-urlencode "platform=${PLATFORM}" \
            --data-urlencode "arch=${ARCH}" \
            --data-urlencode "owner=ttpos")

          UPDATE=$(echo "$RESP" | jq -r '.update_available // "null"')

          if [ "$UPDATE" = "false" ]; then
            VERIFY=$(curl -s --max-time 10 -G "${FAYNOSYNC_URL}/checkVersion" \
              --data-urlencode "app_name=${APP_NAME}" \
              --data-urlencode "version=0.0.0" \
              --data-urlencode "channel=${CHANNEL}" \
              --data-urlencode "platform=${PLATFORM}" \
              --data-urlencode "arch=${ARCH}" \
              --data-urlencode "owner=ttpos")

            VERIFY_UPDATE=$(echo "$VERIFY" | jq -r '.update_available // "null"')

            if [ "$VERIFY_UPDATE" = "true" ]; then
              echo "::error::FaynoSync 已存在 ${APP_NAME} v${CHECK_VERSION} (${CHANNEL}/${PLATFORM}/${ARCH})，跳过构建。如需强制覆盖，请选择 faynosync=force"
              exit 1
            fi
          fi

          echo "FaynoSync 检查通过，继续构建"

      - name: Build APK
        if: steps.check.outputs.should_run == 'true'
        run: |
          dart run ./scripts/build_android.dart --env=${{ inputs.env }} --package=${{ matrix.package }}
          # Rename APK to standardized name
          cd ${{ env.APK_OUTPUT_PATH }}/${{ matrix.package }}/${{ env.VERSION }}
          apk_file=$(ls *.apk 2>/dev/null | head -1)
          if [ -n "$apk_file" ] && [ "$apk_file" != "${{ env.VERSION_APK }}" ]; then
            mv "$apk_file" "${{ env.VERSION_APK }}"
          fi

      - name: 检查构建产物
        if: steps.check.outputs.should_run == 'true'
        run: |
          APK_DIR="${{ env.APK_OUTPUT_PATH }}/${{ matrix.package }}/${{ env.VERSION }}"
          if [ ! -f "${APK_DIR}/${{ env.VERSION_APK }}" ]; then
            echo "错误：未找到构建产物: ${APK_DIR}/${{ env.VERSION_APK }}"
            exit 1
          fi
          echo "构建产物存在: ${APK_DIR}/${{ env.VERSION_APK }}"
          ls -lh "${APK_DIR}"

      - name: 上传构建产物到 Artifact
        if: steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk_name }}-${{ env.VERSION }}
          path: ${{ env.APK_OUTPUT_PATH }}/${{ matrix.package }}/${{ env.VERSION }}/
          retention-days: 7
          compression-level: 0

      - name: SCP-UPLOAD
        if: steps.check.outputs.should_run == 'true' && inputs.scp == 'on'
        uses: Comori/ssh@v0.0.7
        with:
          host: ${{ secrets.SCP_S_HOST }}
          username: ${{ secrets.SCP_S_USER }}
          privateKey: ${{ secrets.SCP_S_RIVATEKEY }}
          command: |
            # 传输到最终服务器
            scp ${{ env.SCP_S_PATH }}${{ env.VERSION_APK }} ${{ secrets.SCP_D_USER }}@${{ secrets.SCP_D_HOST }}:${{ env.SCP_D_PATH }}
          sourceFiles: |
            ${{ env.APK_OUTPUT_PATH }}/${{ matrix.package }}/${{ env.VERSION }}/*.apk
          targetDir: ${{ env.SCP_S_PATH }}
          scpFirst: true

      - name: Create latest symlink
        if: steps.check.outputs.should_run == 'true' && inputs.scp == 'on'
        uses: Comori/ssh@v0.0.7
        with:
          host: ${{ secrets.SCP_S_HOST }}
          username: ${{ secrets.SCP_S_USER }}
          privateKey: ${{ secrets.SCP_S_RIVATEKEY }}
          command: |
            # 在最终服务器创建软链
            ssh -o StrictHostKeyChecking=no ${{ secrets.SCP_D_USER }}@${{ secrets.SCP_D_HOST }} "cd ${{ env.SCP_D_PATH }} && ln -sf ${{ env.VERSION_APK }} ${{ env.LATEST_NAME }}"
            echo "Created symlink: ${{ env.LATEST_NAME }} -> ${{ env.VERSION_APK }}"

      - name: 上传到 FaynoSync
        id: faynosync
        if: steps.check.outputs.should_run == 'true' && inputs.faynosync != 'off'
        continue-on-error: true
        env:
          FAYNOSYNC_URL: ${{ secrets.FAYNOSYNC_URL }}
          FAYNOSYNC_TOKEN: ${{ secrets.FAYNOSYNC_TOKEN }}
        run: |
          FILE_PATH="${{ env.APK_OUTPUT_PATH }}/${{ matrix.package }}/${{ env.VERSION }}/${{ env.VERSION_APK }}"
          if [ ! -f "$FILE_PATH" ]; then
            echo "构建产物不存在，跳过 FaynoSync 上传"
            exit 0
          fi

          if [ -z "$FAYNOSYNC_URL" ] || [ -z "$FAYNOSYNC_TOKEN" ]; then
            echo "未配置 FAYNOSYNC_URL 或 FAYNOSYNC_TOKEN，跳过上传"
            exit 0
          fi

          CHANNEL="${{ inputs.env }}"

          FS_ENDPOINT="/upload"
          if [ "${{ inputs.faynosync }}" = "force" ]; then
            CHECK_RESP=$(curl -s --max-time 10 -G "${FAYNOSYNC_URL}/checkVersion" \
              --data-urlencode "app_name=${{ matrix.faynosync_name }}" \
              --data-urlencode "version=${{ env.FS_VERSION }}" \
              --data-urlencode "channel=${CHANNEL}" \
              --data-urlencode "platform=android" \
              --data-urlencode "arch=arm64" \
              --data-urlencode "owner=ttpos")
            CHECK_UPDATE=$(echo "$CHECK_RESP" | jq -r '.update_available // "null"')
            if [ "$CHECK_UPDATE" = "false" ]; then
              FS_ENDPOINT="/apps/update"
              echo "版本已存在，使用 update 覆盖"
            else
              echo "版本不存在，使用 upload 新建"
            fi
          fi

          echo "上传到 FaynoSync: ${{ matrix.faynosync_name }} v${{ env.FS_VERSION }} (${CHANNEL}/android/arm64)"
          HTTP_CODE=$(curl -s -o /tmp/faynosync_resp.json -w "%{http_code}" -X POST "${FAYNOSYNC_URL}${FS_ENDPOINT}" \
            -H "Authorization: Bearer ${FAYNOSYNC_TOKEN}" \
            -F "file=@${FILE_PATH}" \
            -F "data={\"app_name\":\"${{ matrix.faynosync_name }}\",\"version\":\"${{ env.FS_VERSION }}\",\"channel\":\"${CHANNEL}\",\"publish\":false,\"critical\":false,\"platform\":\"android\",\"arch\":\"arm64\",\"changelog\":\"Build from ${{ inputs.branch }}\"}")
          RESP=$(cat /tmp/faynosync_resp.json 2>/dev/null)
          echo "HTTP ${HTTP_CODE}: ${RESP}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::FaynoSync 上传失败 (HTTP ${HTTP_CODE}): ${RESP}"
            exit 1
          fi
          echo "uploaded=true" >> $GITHUB_OUTPUT
          echo "FaynoSync 上传完成"

      - name: 更新 CMS 下载页
        if: >-
          steps.check.outputs.should_run == 'true'
          && inputs.update_cms == true
          && steps.faynosync.outputs.uploaded == 'true'
          && matrix.cms_title != ''
        continue-on-error: true
        env:
          STRAPI_URL: https://cms.hitosea.com
          STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
          FAYNOSYNC_URL: ${{ secrets.FAYNOSYNC_URL }}
          FAYNOSYNC_TOKEN: ${{ secrets.FAYNOSYNC_TOKEN }}
          CMS_PLATFORM: android
          CMS_ARCH: arm64
          CMS_PKG_FMT: apk
          CMS_PLATFORM_LABEL: Android
          CMS_TITLE: ${{ matrix.cms_title }}
          CMS_VERSION: ${{ env.VERSION }}
        run: |
          if [ -z "$STRAPI_TOKEN" ]; then
            echo "::warning::未配置 STRAPI_TOKEN，跳过 CMS 更新"
            exit 0
          fi

          CHANNEL="${{ inputs.env }}"

          # 从 FaynoSync 获取下载链接（使用 --data-urlencode 处理含空格的 app_name）
          DOWNLOAD_URL=$(curl -s -o /dev/null -w "%{redirect_url}" -G \
            "${FAYNOSYNC_URL}/apps/latest" \
            --data-urlencode "app_name=${{ matrix.faynosync_name }}" \
            --data-urlencode "channel=${CHANNEL}" \
            --data-urlencode "platform=${CMS_PLATFORM}" \
            --data-urlencode "arch=${CMS_ARCH}" \
            --data-urlencode "package=${CMS_PKG_FMT}" \
            --data-urlencode "owner=ttpos")

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::warning::无法从 FaynoSync 获取下载链接，跳过 CMS 更新"
            exit 0
          fi

          echo "获取到下载链接: ${DOWNLOAD_URL}"

          POPULATE="populate[items][populate][downloadButton]=*&populate[items][populate][downloadButtons]=*&populate[items][populate][thumbnail]=*&populate[items][populate][platforms]=*"

          CMS_DATA=$(curl -s \
            "${STRAPI_URL}/api/tt-pos-download?locale=en&${POPULATE}" \
            -H "Authorization: Bearer ${STRAPI_TOKEN}")

          if ! echo "$CMS_DATA" | jq -e '.data.attributes.items' > /dev/null 2>&1; then
            echo "::warning::无法获取 CMS 数据，跳过"
            exit 0
          fi

          HAS_MATCH=$(echo "$CMS_DATA" | jq --arg title "$CMS_TITLE" \
            '[.data.attributes.items[] | select(.title == $title)] | length')

          if [ "$HAS_MATCH" = "0" ]; then
            echo "::warning::CMS 中未找到 ${CMS_TITLE}，跳过"
            exit 0
          fi

          UPDATED=$(echo "$CMS_DATA" | jq \
            --arg url "$DOWNLOAD_URL" \
            --arg ver "V${CMS_VERSION}" \
            --arg date "$(date +%Y-%m-%d)" \
            --arg label "$CMS_PLATFORM_LABEL" \
            --arg title "$CMS_TITLE" \
            '
            .data.attributes |
            del(.createdAt, .updatedAt, .publishedAt, .locale) |
            .localizations = [.localizations.data[]?.id] |
            .items |= map(
              .thumbnail = (if .thumbnail and .thumbnail.data then .thumbnail.data.id else null end) |
              .platforms = [.platforms[]? | {label}] |
              .downloadButton = (if .downloadButton then {label: .downloadButton.label, href: .downloadButton.href, target: .downloadButton.target} else null end) |
              .downloadButtons = [.downloadButtons[]? | {label, href, target}] |
              if .title == $title then
                .version = $ver |
                .releasedAt = $date |
                (.downloadButtons |= map(
                  if .label == $label then .href = $url else . end
                )) |
                if $label == "Android" then .downloadButton.href = $url else . end
              else . end
            ) |
            { data: . }
            ')

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "${STRAPI_URL}/api/tt-pos-download?locale=en" \
            -H "Authorization: Bearer ${STRAPI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$UPDATED")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "CMS 更新成功 (HTTP ${HTTP_STATUS})"
          else
            echo "::warning::CMS 更新失败 (HTTP ${HTTP_STATUS})"
          fi

      - name: 构建完成总结
        if: always() && steps.check.outputs.should_run == 'true'
        run: |
          echo "========================================="
          echo "构建任务完成"
          echo "========================================="
          echo "应用端: ${{ matrix.package }}"
          echo "版本: ${{ env.VERSION }}"
          echo "分支: ${{ inputs.branch }}"
          echo "环境: ${{ inputs.env }}"
          echo "========================================="
