name: "Build: MCP Server"

on:
  workflow_dispatch:
  push:
    branches: [main, release]
    # tag 必触发打包（GitHub 对 tag 推送不应用 paths）；分支推送受下方 paths 约束。
    tags:
      - "mcp-v*"
    paths:
      - "apps/mcp/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - ".dockerignore"
      - ".github/workflows/build-mcp.yaml"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: 恢复 Turbo 缓存
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          # 命中不到精确 key 时回退最近一次缓存，turbo 再按 inputs 增量判定
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bunx turbo typecheck --filter=@ttpos/mcp

      - name: ESLint
        run: bunx eslint apps/mcp

      - name: 单元测试
        run: bunx turbo test --filter=@ttpos/mcp

  build:
    needs: [quality-gates]
    # 仅在打了 mcp-v* tag 时才打包推镜像；分支推送只跑质量门。
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ttpos-mcp
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取 Commit 信息
        id: git_info
        run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=match,pattern=mcp-v(.*),group=1
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          platforms: linux/amd64

      - name: 构建完成总结
        if: always()
        run: |
          echo "MCP 镜像构建完成 — commit ${{ steps.git_info.outputs.COMMIT_SHA }}"
          echo "${{ steps.meta.outputs.tags }}"
