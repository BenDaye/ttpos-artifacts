name: "Build: Server"

on:
  workflow_dispatch:
  push:
    branches: [main, release]
    # tag 必触发打包（GitHub 对 tag 推送不应用 paths）；分支推送不再用 paths
    # 过滤（ENH-017）：改由 affected 预检 job 按 turbo 依赖图判定质量门跑不跑。
    tags:
      - "server-v*"

jobs:
  # ENH-017：轻量预检（~30s，无需 bun install），机制同 build-dashboard.yaml。
  # @ttpos/server 经薄 package.json 挂在 turbo 包图上，.go 改动即计为受影响。
  affected:
    runs-on: ubuntu-latest
    outputs:
      run_gates: ${{ steps.check.outputs.run_gates }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # --affected 需要完整历史才能与 push 前的 base commit 比对
          fetch-depth: 0

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: 判定 @ttpos/server 是否受影响
        id: check
        env:
          BASE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          # tag 推送 / 手动触发 / base 不可用（新分支首推、force-push）→ 保守全跑
          if [[ "${{ github.ref_type }}" == "tag" || "${{ github.event_name }}" != "push" ]] \
             || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run_gates=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # turbo 版本与根 package.json devDependencies 保持一致（预检不装依赖，走 bunx 直取）
          affected_json=$(TURBO_SCM_BASE="$BASE" bunx turbo@2.10.3 ls --affected --output=json 2>/dev/null) || affected_json=''
          # turbo 异常时 fail-open：宁可多跑质量门，不可漏跑
          if [[ -z "$affected_json" ]]; then
            echo "run_gates=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if jq -e '.packages.items[] | select(.name == "@ttpos/server")' <<<"$affected_json" > /dev/null \
             || git diff --name-only "$BASE"..HEAD | grep -qE '^\.github/workflows/build-server\.yaml'; then
            echo "run_gates=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_gates=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: "质量门: go build / vet / unit"
    needs: affected
    if: needs.affected.outputs.run_gates == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # 无需外部依赖的单元测试。集成套件（faynoSync_test.go）依赖
      # MongoDB/Redis/S3，需服务容器编排，作为后续任务补齐（见 PLAN-035）。
      - name: go test (单元)
        run: go test ./server/ownership/... ./server/utils/...

  build:
    needs: test
    # 仅在打了 server-v* tag 时才打包推镜像；分支推送只跑质量门（与 web/mcp 对齐，PLAN-036）。
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ttpos-server
    steps:
      - name: 显示构建信息
        run: |
          echo "========================================="
          echo "Server 构建信息"
          echo "========================================="
          echo "Ref: ${{ github.ref_name }}"
          echo "触发: ${{ github.event_name }}"
          echo "镜像: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}"
          echo "========================================="

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取 Commit 信息
        id: git_info
        run: |
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "COMMIT_MSG=$(git log -1 --pretty=format:%s)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          # 关闭隐式 latest，与 build-dashboard/build-mcp 同构：tag 事件下由显式 raw 提供 latest。
          flavor: |
            latest=false
          tags: |
            type=match,pattern=server-v(.*),group=1
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: apps/server
          file: apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          platforms: linux/amd64

      - name: 构建完成总结
        if: always()
        run: |
          echo "========================================="
          echo "Server 构建完成"
          echo "========================================="
          echo "Commit: ${{ steps.git_info.outputs.COMMIT_SHA }}"
          echo "镜像标签:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "========================================="
