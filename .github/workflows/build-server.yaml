name: "Build: Server"

on:
  workflow_dispatch:
  push:
    branches: [main, release]
    # tag 必触发打包（GitHub 对 tag 推送不应用 paths）；分支推送受下方 paths 约束、只跑质量门。
    tags:
      - "server-v*"
    paths:
      - "apps/server/**"
      - ".github/workflows/build-server.yaml"

jobs:
  test:
    name: "质量门: go build / vet / unit"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # 无需外部依赖的单元测试。集成套件（faynoSync_test.go）依赖
      # MongoDB/Redis/S3，需服务容器编排，作为后续任务补齐（见 PLAN-035）。
      - name: go test (单元)
        run: go test ./server/ownership/... ./server/utils/...

  build:
    needs: test
    # 仅在打了 server-v* tag 时才打包推镜像；分支推送只跑质量门（与 web/mcp 对齐，PLAN-036）。
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ttpos-server
    steps:
      - name: 显示构建信息
        run: |
          echo "========================================="
          echo "Server 构建信息"
          echo "========================================="
          echo "Ref: ${{ github.ref_name }}"
          echo "触发: ${{ github.event_name }}"
          echo "镜像: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}"
          echo "========================================="

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取 Commit 信息
        id: git_info
        run: |
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "COMMIT_MSG=$(git log -1 --pretty=format:%s)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          # 关闭隐式 latest，与 build-dashboard/build-mcp 同构：tag 事件下由显式 raw 提供 latest。
          flavor: |
            latest=false
          tags: |
            type=match,pattern=server-v(.*),group=1
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: apps/server
          file: apps/server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          platforms: linux/amd64

      - name: 构建完成总结
        if: always()
        run: |
          echo "========================================="
          echo "Server 构建完成"
          echo "========================================="
          echo "Commit: ${{ steps.git_info.outputs.COMMIT_SHA }}"
          echo "镜像标签:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "========================================="
