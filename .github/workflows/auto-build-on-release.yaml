name: Auto Build on Release Push

on:
  repository_dispatch:
    types: [release-push]
  workflow_dispatch:
    inputs:
      branch:
        description: "构建分支"
        required: true
        type: string
        default: "release"
      env:
        description: "选择构建环境"
        required: true
        type: choice
        options:
          - "prod"
          - "test"
          - "dev"
        default: "prod"
      package:
        description: "选择要构建的应用端"
        required: true
        type: choice
        options:
          - all
          - pos
          - shop
          - kds
          - qds
          - assistant
          - tablet
          - kiosk
          - mobile
          - menu
          - member
        default: "all"
      platform:
        description: "选择构建平台"
        required: true
        type: choice
        options:
          - all
          - android
          - windows
          - web
          - macos
          - ios
        default: "all"
      base_url:
        description: "选择API基础URL"
        required: true
        type: choice
        default: "https://api.ttpos.com/api/v1"
        options:
          - "https://api.ttpos.com/api/v1"
          - "https://ttpos-test1.ttpos.com/api/v1"
          - "https://ttpos-pro.keli.vip/api/v1"
      base_ws_url:
        description: "选择WebSocket基础URL"
        required: true
        type: choice
        default: "wss://api.ttpos.com/ws"
        options:
          - "wss://api.ttpos.com/ws"
          - "wss://ttpos-test1.ttpos.com/ws"
          - "wss://ttpos-pro.keli.vip/ws"
      updater_url:
        description: "自定义更新服务URL (覆盖 UPDATER_URL)"
        required: false
        type: string
      updater_owner:
        description: "自定义更新服务Owner (覆盖 UPDATER_OWNER)"
        required: false
        type: string
      updater_channel:
        description: "自定义更新频道 (覆盖 UPDATER_CHANNEL)"
        required: false
        type: choice
        options:
          - ""
          - "prod"
          - "test"
          - "dev"
      scp:
        description: "是否启用SCP传输"
        required: true
        type: choice
        options:
          - "on"
          - "off"
        default: "off"
      faynosync:
        description: "FaynoSync 上传模式 (on=检查版本已存在则跳过, force=强制覆盖)"
        required: false
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
          - "force"
      update_cms:
        description: "是否更新 CMS 下载页"
        required: false
        type: boolean
        default: false

permissions:
  actions: write

jobs:
  trigger-builds:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ inputs.branch || github.event.client_payload.branch || 'release' }}
      BUILD_ENV: ${{ inputs.env || github.event.client_payload.env || 'prod' }}
      BASE_URL: ${{ inputs.base_url || github.event.client_payload.base_url || 'https://api.ttpos.com/api/v1' }}
      BASE_WS_URL: ${{ inputs.base_ws_url || github.event.client_payload.base_ws_url || 'wss://api.ttpos.com/ws' }}
      PACKAGE: ${{ inputs.package || github.event.client_payload.package || 'all' }}
      PLATFORM: ${{ inputs.platform || github.event.client_payload.platform || 'all' }}
      UPDATER_URL: ${{ inputs.updater_url || github.event.client_payload.updater_url || '' }}
      UPDATER_OWNER: ${{ inputs.updater_owner || github.event.client_payload.updater_owner || '' }}
      UPDATER_CHANNEL: ${{ inputs.updater_channel || github.event.client_payload.updater_channel || '' }}
      SCP: ${{ inputs.scp || github.event.client_payload.scp || 'off' }}
      FAYNOSYNC: ${{ inputs.faynosync || github.event.client_payload.faynosync || 'off' }}
      UPDATE_CMS: ${{ inputs.update_cms || github.event.client_payload.update_cms || 'false' }}
    steps:
      - name: 显示构建参数
        run: |
          echo "========================================="
          echo "正式构建参数"
          echo "========================================="
          echo "分支: ${{ env.BRANCH }}"
          echo "环境: ${{ env.BUILD_ENV }}"
          echo "应用端: ${{ env.PACKAGE }}"
          echo "平台: ${{ env.PLATFORM }}"
          echo "API URL: ${{ env.BASE_URL }}"
          echo "WS URL: ${{ env.BASE_WS_URL }}"
          echo "SCP: ${{ env.SCP }}"
          echo "FaynoSync: ${{ env.FAYNOSYNC }}"
          echo "更新CMS: ${{ env.UPDATE_CMS }}"
          echo "========================================="

      - name: 触发 Android 构建
        if: env.PLATFORM == 'all' || env.PLATFORM == 'android'
        run: |
          gh workflow run build-android.yaml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            -f branch=${{ env.BRANCH }} \
            -f env=${{ env.BUILD_ENV }} \
            -f package=${{ env.PACKAGE }} \
            -f base_url=${{ env.BASE_URL }} \
            -f base_ws_url=${{ env.BASE_WS_URL }} \
            -f updater_url=${{ env.UPDATER_URL }} \
            -f updater_owner=${{ env.UPDATER_OWNER }} \
            -f updater_channel=${{ env.UPDATER_CHANNEL }} \
            -f scp=${{ env.SCP }} \
            -f faynosync=${{ env.FAYNOSYNC }} \
            -f update_cms=${{ env.UPDATE_CMS }}

      - name: 触发 iOS 构建
        if: env.PLATFORM == 'all' || env.PLATFORM == 'ios'
        run: |
          gh workflow run build-ios.yaml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            -f branch=${{ env.BRANCH }} \
            -f env=${{ env.BUILD_ENV }} \
            -f package=${{ env.PACKAGE }} \
            -f base_url=${{ env.BASE_URL }} \
            -f base_ws_url=${{ env.BASE_WS_URL }} \
            -f updater_url=${{ env.UPDATER_URL }} \
            -f updater_owner=${{ env.UPDATER_OWNER }} \
            -f updater_channel=${{ env.UPDATER_CHANNEL }} \
            -f faynosync=${{ env.FAYNOSYNC }}

      - name: 触发 Windows 构建
        if: env.PLATFORM == 'all' || env.PLATFORM == 'windows'
        run: |
          gh workflow run build-windows.yaml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            -f branch=${{ env.BRANCH }} \
            -f env=${{ env.BUILD_ENV }} \
            -f package=${{ env.PACKAGE }} \
            -f base_url=${{ env.BASE_URL }} \
            -f base_ws_url=${{ env.BASE_WS_URL }} \
            -f updater_url=${{ env.UPDATER_URL }} \
            -f updater_owner=${{ env.UPDATER_OWNER }} \
            -f updater_channel=${{ env.UPDATER_CHANNEL }} \
            -f scp=${{ env.SCP }} \
            -f faynosync=${{ env.FAYNOSYNC }} \
            -f update_cms=${{ env.UPDATE_CMS }}

      - name: 触发 macOS 构建
        if: env.PLATFORM == 'all' || env.PLATFORM == 'macos'
        run: |
          gh workflow run build-macos.yaml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            -f branch=${{ env.BRANCH }} \
            -f env=${{ env.BUILD_ENV }} \
            -f package=${{ env.PACKAGE }} \
            -f base_url=${{ env.BASE_URL }} \
            -f base_ws_url=${{ env.BASE_WS_URL }} \
            -f updater_url=${{ env.UPDATER_URL }} \
            -f updater_owner=${{ env.UPDATER_OWNER }} \
            -f updater_channel=${{ env.UPDATER_CHANNEL }} \
            -f scp=${{ env.SCP }} \
            -f faynosync=${{ env.FAYNOSYNC }} \
            -f update_cms=${{ env.UPDATE_CMS }}

      - name: 触发 Web 构建
        if: env.PLATFORM == 'all' || env.PLATFORM == 'web'
        run: |
          gh workflow run build-web.yaml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            -f branch=${{ env.BRANCH }} \
            -f env=${{ env.BUILD_ENV }} \
            -f package=${{ env.PACKAGE }} \
            -f base_url=${{ env.BASE_URL }} \
            -f base_ws_url=${{ env.BASE_WS_URL }} \
            -f updater_url=${{ env.UPDATER_URL }} \
            -f updater_owner=${{ env.UPDATER_OWNER }} \
            -f updater_channel=${{ env.UPDATER_CHANNEL }}

      - name: 构建触发完成
        run: |
          echo "========================================="
          echo "所有构建已触发"
          echo "========================================="
          echo "请到 Actions 页面查看各平台构建进度"
          echo "========================================="
