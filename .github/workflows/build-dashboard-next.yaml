name: "Build: Dashboard Next"

on:
  workflow_dispatch:
  push:
    branches: [main, release]
    paths:
      - "dashboard-next/apps/web/src/**"
      - "dashboard-next/apps/web/public/**"
      - "dashboard-next/apps/web/package.json"
      - "dashboard-next/apps/web/vite.config.ts"
      - "dashboard-next/apps/web/tsconfig*.json"
      - "dashboard-next/apps/web/tsr.config.json"
      - "dashboard-next/apps/web/components.json"
      - "dashboard-next/apps/web/index.html"
      - "dashboard-next/apps/web/Dockerfile"
      - "dashboard-next/apps/web/nginx.conf"
      - "dashboard-next/apps/web/docker-entrypoint.sh"
      - "dashboard-next/packages/**"
      - "dashboard-next/package.json"
      - "dashboard-next/bun.lock"
      - "dashboard-next/eslint.config.js"
      - "dashboard-next/Dockerfile"
      - ".github/workflows/build-dashboard-next.yaml"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-next
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: 单元测试
        run: bun run test

      - name: 生产构建
        run: bun run build

      - name: 安装 Playwright 浏览器
        run: bun x playwright install --with-deps chromium

      - name: E2E 烟测
        run: bun run test:e2e

      - name: 上传 E2E 报告
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: dashboard-next-playwright-report
          path: dashboard-next/playwright-report/
          retention-days: 7

  build:
    needs: [quality-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: faynosync-dashboard-next
    steps:
      - name: 显示构建信息
        run: |
          echo "========================================="
          echo "Dashboard-next 构建信息"
          echo "========================================="
          echo "分支: ${{ github.ref_name }}"
          echo "触发: ${{ github.event_name }}"
          echo "镜像: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}"
          echo "========================================="

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取 Commit 信息
        id: git_info
        run: |
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "COMMIT_MSG=$(git log -1 --pretty=format:%s)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard-next
          file: ./dashboard-next/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          platforms: linux/amd64

      - name: 构建完成总结
        if: always()
        run: |
          echo "========================================="
          echo "Dashboard-next 构建完成"
          echo "========================================="
          echo "Commit: ${{ steps.git_info.outputs.COMMIT_SHA }}"
          echo "镜像标签:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "========================================="
