name: "Test: CMS Update"

on:
  workflow_dispatch:
    inputs:
      app:
        description: "选择应用端 (仅含 CMS 配置的应用)"
        required: true
        type: choice
        options:
          - all
          - pos
          - kds
          - shop
          - assistant
          - tablet
        default: "all"
      platform:
        description: "选择平台 (在单个 job 内过滤，不再按平台拆分 job)"
        required: true
        type: choice
        options:
          - all
          - android
          - windows
          - macos
        default: "all"
      env:
        description: "选择频道/环境"
        required: true
        type: choice
        options:
          - "prod"
          - "test"
          - "dev"
        default: "test"
      dry_run:
        description: "Dry-run 模式：仅预览变更，不实际写入 CMS"
        required: true
        type: boolean
        default: true

jobs:
  update-cms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [pos, kds, shop, assistant, tablet]
        include:
          - app: pos
            faynosync_name: "TTPOS"
            cms_title: "Cashier"
          - app: assistant
            faynosync_name: "TTPOS Go"
            cms_title: "Assistant"
          - app: kds
            faynosync_name: "TTPOS Kitchen"
            cms_title: "KDS Kitchen"
          - app: tablet
            faynosync_name: "TTPOS Menu"
            cms_title: "Tablet Menu"
          - app: shop
            faynosync_name: "TTPOS Shop"
            cms_title: "Shop"
    env:
      STRAPI_URL: https://cms.hitosea.com
      STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
      FAYNOSYNC_URL: ${{ secrets.FAYNOSYNC_URL }}
    steps:
      - name: 检查是否需要运行
        id: check
        run: |
          SHOULD_RUN=true
          if [ "${{ inputs.app }}" != "all" ] && [ "${{ inputs.app }}" != "${{ matrix.app }}" ]; then
            SHOULD_RUN=false
          fi
          echo "should_run=${SHOULD_RUN}" >> $GITHUB_OUTPUT
          if [ "$SHOULD_RUN" = "false" ]; then
            echo "跳过 ${{ matrix.app }} (选择: ${{ inputs.app }})"
          fi

      - name: 显示测试参数
        if: steps.check.outputs.should_run == 'true'
        run: |
          echo "========================================="
          echo "CMS 下载页更新测试"
          echo "========================================="
          echo "应用:      ${{ matrix.app }} (${{ matrix.faynosync_name }})"
          echo "CMS 标题:  ${{ matrix.cms_title }}"
          echo "平台筛选:  ${{ inputs.platform }}"
          echo "频道:      ${{ inputs.env }}"
          echo "Dry-run:   ${{ inputs.dry_run }}"
          echo "========================================="

      - name: 检查 Secrets 配置
        if: steps.check.outputs.should_run == 'true'
        run: |
          MISSING=""
          if [ -z "$STRAPI_TOKEN" ]; then MISSING="${MISSING} STRAPI_TOKEN"; fi
          if [ -z "$FAYNOSYNC_URL" ]; then MISSING="${MISSING} FAYNOSYNC_URL"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::缺少必要 Secrets:${MISSING}"
            exit 1
          fi
          echo "Secrets 检查通过"

      - name: 从 FaynoSync 查询各平台下载信息
        id: query
        if: steps.check.outputs.should_run == 'true'
        run: |
          CHANNEL="${{ inputs.env }}"
          APP_NAME="${{ matrix.faynosync_name }}"

          ALL_PLATFORMS='[
            {"platform":"android","arch":"arm64","pkg_fmt":"apk","label":"Android"},
            {"platform":"windows","arch":"amd64","pkg_fmt":"exe","label":"Windows"},
            {"platform":"macos","arch":"arm64","pkg_fmt":"dmg","label":"MacOS"}
          ]'

          if [ "${{ inputs.platform }}" != "all" ]; then
            PLATFORMS=$(echo "$ALL_PLATFORMS" | jq -c --arg p "${{ inputs.platform }}" '[.[] | select(.platform == $p)]')
          else
            PLATFORMS="$ALL_PLATFORMS"
          fi

          echo "待查询平台: $(echo "$PLATFORMS" | jq -r '[.[].label] | join(", ")')"

          RESULTS='[]'

          for row in $(echo "$PLATFORMS" | jq -c '.[]'); do
            PLAT=$(echo "$row" | jq -r '.platform')
            ARCH=$(echo "$row" | jq -r '.arch')
            PKG=$(echo "$row" | jq -r '.pkg_fmt')
            LABEL=$(echo "$row" | jq -r '.label')

            echo ""
            echo "--- 查询 ${LABEL} (${PLAT}/${ARCH}/${PKG}) ---"

            HEADERS=$(mktemp)
            DOWNLOAD_URL=$(curl -s -D "$HEADERS" -o /dev/null -w "%{redirect_url}" -G \
              "${FAYNOSYNC_URL}/apps/latest" \
              --data-urlencode "app_name=${APP_NAME}" \
              --data-urlencode "channel=${CHANNEL}" \
              --data-urlencode "platform=${PLAT}" \
              --data-urlencode "arch=${ARCH}" \
              --data-urlencode "package=${PKG}" \
              --data-urlencode "owner=ttpos")

            HTTP_CODE=$(head -1 "$HEADERS" | grep -oP '\d{3}')
            echo "HTTP 状态: ${HTTP_CODE}"
            rm -f "$HEADERS"

            if [ -z "$DOWNLOAD_URL" ]; then
              echo "::warning::FaynoSync 中不存在 ${APP_NAME} 的 ${CHANNEL}/${PLAT}/${ARCH} 版本，跳过"
              continue
            fi

            echo "原始链接: ${DOWNLOAD_URL}"
            DOWNLOAD_URL=$(echo "$DOWNLOAD_URL" | \
              sed 's|https://storage.googleapis.com/|https://ttpos.com/storage_googleapis/|' | \
              sed 's| |%20|g')
            echo "CMS 链接: ${DOWNLOAD_URL}"

            VER=$(echo "$DOWNLOAD_URL" | grep -oP '\d+\.\d+\.\d+' | tail -1)

            if [ -z "$VER" ]; then
              echo "::warning::无法从下载链接提取版本号，尝试 checkVersion API"
              RESP=$(curl -s --max-time 10 -G "${FAYNOSYNC_URL}/checkVersion" \
                --data-urlencode "app_name=${APP_NAME}" \
                --data-urlencode "version=0.0.0" \
                --data-urlencode "channel=${CHANNEL}" \
                --data-urlencode "platform=${PLAT}" \
                --data-urlencode "arch=${ARCH}" \
                --data-urlencode "owner=ttpos")

              echo "checkVersion 响应:"
              echo "$RESP" | jq . 2>/dev/null || echo "$RESP"

              VER=$(echo "$RESP" | jq -r '
                [to_entries[] | select(.key | startswith("update_url")) | .value] | first // ""
              ' | grep -oP '\d+\.\d+\.\d+' | head -1)
            fi

            if [ -z "$VER" ]; then
              echo "::warning::无法获取 ${LABEL} 版本号，跳过此平台"
              continue
            fi

            echo "版本: ${VER}"

            RESULTS=$(echo "$RESULTS" | jq -c \
              --arg label "$LABEL" --arg url "$DOWNLOAD_URL" --arg ver "$VER" \
              '. + [{"label": $label, "url": $url, "version": $ver}]')
          done

          COUNT=$(echo "$RESULTS" | jq 'length')
          echo ""
          echo "========================================="
          echo "查询结果: ${COUNT} 个平台有可用版本"
          echo "$RESULTS" | jq -r '.[] | "  \(.label): V\(.version) → \(.url[0:80])..."'

          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::所有平台均无可用版本"
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "results=[]" >> $GITHUB_OUTPUT
            echo "latest_version=" >> $GITHUB_OUTPUT
            exit 0
          fi

          UNIQUE_VERS=$(echo "$RESULTS" | jq '[.[].version] | unique | length')
          if [ "$UNIQUE_VERS" -gt 1 ]; then
            echo "::warning::不同平台返回了不同的版本号: $(echo "$RESULTS" | jq -r '[.[].version] | unique | join(", ")')"
          fi

          LATEST_VERSION=$(echo "$RESULTS" | jq -r \
            '[.[].version] | unique | sort_by(split(".") | map(tonumber)) | last')
          echo "采用版本: V${LATEST_VERSION}"

          echo "results=$(echo "$RESULTS" | jq -c '.')" >> $GITHUB_OUTPUT
          echo "has_updates=true" >> $GITHUB_OUTPUT
          echo "latest_version=${LATEST_VERSION}" >> $GITHUB_OUTPUT

      - name: 获取 CMS 当前数据
        id: cms_read
        if: steps.check.outputs.should_run == 'true' && steps.query.outputs.has_updates == 'true'
        run: |
          POPULATE="populate[items][populate][downloadButton]=*&populate[items][populate][downloadButtons]=*&populate[items][populate][thumbnail]=*&populate[items][populate][platforms]=*"

          HTTP_BODY=$(mktemp)
          HTTP_CODE=$(curl -g -s -o "$HTTP_BODY" -w "%{http_code}" \
            "${STRAPI_URL}/api/tt-pos-download?locale=en&${POPULATE}" \
            -H "Authorization: Bearer ${STRAPI_TOKEN}")

          echo "CMS API HTTP 状态: ${HTTP_CODE}"
          BODY_SIZE=$(wc -c < "$HTTP_BODY")
          echo "响应大小: ${BODY_SIZE} bytes"

          if [ "$HTTP_CODE" -ge 400 ] || [ "$BODY_SIZE" -lt 10 ]; then
            echo "::error::CMS API 请求失败 (HTTP ${HTTP_CODE}, ${BODY_SIZE} bytes)"
            cat "$HTTP_BODY" | head -c 2000
            rm -f "$HTTP_BODY"
            exit 1
          fi

          CMS_DATA=$(cat "$HTTP_BODY")
          rm -f "$HTTP_BODY"

          if ! echo "$CMS_DATA" | jq -e '.' > /dev/null 2>&1; then
            echo "::error::CMS 响应不是有效 JSON，前 500 字符:"
            echo "$CMS_DATA" | head -c 500
            exit 1
          fi

          echo ""
          echo "--- CMS 响应顶层结构 ---"
          echo "$CMS_DATA" | jq '{keys: keys, data_type: (.data | type), data_keys: (.data | if type == "object" then keys else "N/A" end)}'

          if echo "$CMS_DATA" | jq -e '.data.attributes.items' > /dev/null 2>&1; then
            echo "数据路径: .data.attributes.items (Strapi v4)"
          elif echo "$CMS_DATA" | jq -e '.data.items' > /dev/null 2>&1; then
            echo "数据路径: .data.items (Strapi v5)"
            echo "::warning::检测到 Strapi v5 结构，生产 workflow 使用 v4 路径，可能需要同步更新"
          else
            echo "::error::无法定位 items 数组"
            echo "--- 完整响应结构 (前 80 行) ---"
            echo "$CMS_DATA" | jq '.' | head -80
            exit 1
          fi

          ITEMS=$(echo "$CMS_DATA" | jq '.data.attributes.items // .data.items')

          echo ""
          echo "--- CMS 条目摘要 (共 $(echo "$ITEMS" | jq 'length') 条) ---"
          echo "$ITEMS" | jq -r '.[] |
            "  [\(.title)] ver=\(.version // "N/A") date=\(.releasedAt // "N/A") buttons=\([.downloadButtons[]? | "\(.label):\(.href[0:50])..."] | join(" | "))"
          '

          echo ""
          echo "--- 目标条目: ${{ matrix.cms_title }} ---"
          echo "$ITEMS" | jq --arg title "${{ matrix.cms_title }}" '.[] | select(.title == $title) |
            {title, version, releasedAt, downloadButton: .downloadButton.href, downloadButtons: [.downloadButtons[]? | {label, href}]}'

          HAS_MATCH=$(echo "$ITEMS" | jq --arg title "${{ matrix.cms_title }}" \
            '[.[] | select(.title == $title)] | length')

          if [ "$HAS_MATCH" = "0" ]; then
            echo "::error::CMS 中未找到 [${{ matrix.cms_title }}]"
            echo "可用标题: $(echo "$ITEMS" | jq -r '[.[].title] | join(", ")')"
            exit 1
          fi

          echo "$CMS_DATA" > /tmp/cms_data.json

      - name: 生成更新 Payload 并对比
        id: payload
        if: steps.check.outputs.should_run == 'true' && steps.query.outputs.has_updates == 'true'
        env:
          CMS_VERSION: ${{ steps.query.outputs.latest_version }}
          CMS_TITLE: ${{ matrix.cms_title }}
          PLATFORM_RESULTS: ${{ steps.query.outputs.results }}
        run: |
          CMS_DATA=$(cat /tmp/cms_data.json)

          UPDATED=$(echo "$CMS_DATA" | jq \
            --arg ver "V${CMS_VERSION}" \
            --arg date "$(date +%Y-%m-%d)" \
            --arg title "$CMS_TITLE" \
            --argjson updates "$PLATFORM_RESULTS" \
            '
            (.data.attributes // .data) |
            del(.createdAt, .updatedAt, .publishedAt, .locale) |
            .localizations = [.localizations.data[]?.id] |
            .items |= map(
              .thumbnail = (if .thumbnail and .thumbnail.data then .thumbnail.data.id else null end) |
              .platforms = [.platforms[]? | {label}] |
              .downloadButton = (if .downloadButton then {label: .downloadButton.label, href: .downloadButton.href, target: .downloadButton.target} else null end) |
              .downloadButtons = [.downloadButtons[]? | {label, href, target}] |
              if .title == $title then
                .version = $ver |
                .releasedAt = $date |
                (.downloadButtons |= [.[] as $btn |
                  ($updates | map(select(.label == $btn.label)) | first // null) as $upd |
                  if $upd then ($btn | .href = $upd.url) else $btn end
                ]) |
                (($updates | map(select(.label == "Android")) | first // null) as $android |
                  if $android then .downloadButton.href = $android.url else . end)
              else . end
            ) |
            { data: . }
            ')

          echo "$UPDATED" > /tmp/cms_payload.json

          echo "========================================="
          echo "变更摘要: ${{ matrix.app }} (全平台合并)"
          echo "========================================="
          echo "目标:     ${CMS_TITLE}"
          echo "版本:     V${CMS_VERSION}"
          echo "日期:     $(date +%Y-%m-%d)"
          echo "更新平台: $(echo "$PLATFORM_RESULTS" | jq -r '[.[].label] | join(", ")')"
          echo ""
          echo "--- 更新前 ---"
          cat /tmp/cms_data.json | jq --arg title "$CMS_TITLE" \
            '(.data.attributes.items // .data.items)[] | select(.title == $title) | {version, releasedAt, downloadButton: .downloadButton.href, downloadButtons: [.downloadButtons[]? | "\(.label): \(.href)"]}'
          echo "--- 更新后 ---"
          echo "$UPDATED" | jq --arg title "$CMS_TITLE" \
            '.data.items[] | select(.title == $title) | {version, releasedAt, downloadButton: .downloadButton.href, downloadButtons: [.downloadButtons[]? | "\(.label): \(.href)"]}'

      - name: 写入 CMS
        if: >-
          steps.check.outputs.should_run == 'true'
          && steps.query.outputs.has_updates == 'true'
          && inputs.dry_run == false
        run: |
          PAYLOAD=$(cat /tmp/cms_payload.json)

          HTTP_BODY=$(mktemp)
          HTTP_STATUS=$(curl -s -o "$HTTP_BODY" -w "%{http_code}" \
            -X PUT "${STRAPI_URL}/api/tt-pos-download?locale=en" \
            -H "Authorization: Bearer ${STRAPI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "HTTP 状态码: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "CMS 更新成功 (${{ matrix.app }} — 全平台合并写入)"
          else
            echo "::error::CMS 更新失败 (HTTP ${HTTP_STATUS})"
            cat "$HTTP_BODY" | jq . 2>/dev/null || cat "$HTTP_BODY"
            exit 1
          fi
          rm -f "$HTTP_BODY"

      - name: 验证 CMS 更新结果
        if: >-
          steps.check.outputs.should_run == 'true'
          && steps.query.outputs.has_updates == 'true'
          && inputs.dry_run == false
        env:
          CMS_VERSION: ${{ steps.query.outputs.latest_version }}
          CMS_TITLE: ${{ matrix.cms_title }}
          PLATFORM_RESULTS: ${{ steps.query.outputs.results }}
        run: |
          sleep 3

          POPULATE="populate[items][populate][downloadButton]=*&populate[items][populate][downloadButtons]=*&populate[items][populate][thumbnail]=*&populate[items][populate][platforms]=*"

          VERIFY=$(curl -g -s \
            "${STRAPI_URL}/api/tt-pos-download?locale=en&${POPULATE}" \
            -H "Authorization: Bearer ${STRAPI_TOKEN}")

          ITEM=$(echo "$VERIFY" | jq --arg title "$CMS_TITLE" \
            '(.data.attributes.items // .data.items)[] | select(.title == $title)')

          ACTUAL_VER=$(echo "$ITEM" | jq -r '.version')
          EXPECTED_VER="V${CMS_VERSION}"
          if [ "$ACTUAL_VER" = "$EXPECTED_VER" ]; then
            echo "版本号验证通过: ${ACTUAL_VER}"
          else
            echo "::warning::版本号不匹配 — 期望: ${EXPECTED_VER}, 实际: ${ACTUAL_VER}"
          fi

          for row in $(echo "$PLATFORM_RESULTS" | jq -c '.[]'); do
            LABEL=$(echo "$row" | jq -r '.label')
            EXPECTED_URL=$(echo "$row" | jq -r '.url')

            ACTUAL_BTN=$(echo "$ITEM" | jq -r --arg label "$LABEL" \
              '.downloadButtons[]? | select(.label == $label) | .href')
            if [ "$ACTUAL_BTN" = "$EXPECTED_URL" ]; then
              echo "${LABEL} 下载链接验证通过"
            else
              echo "::warning::${LABEL} 下载链接不匹配 — 期望: ${EXPECTED_URL}, 实际: ${ACTUAL_BTN}"
            fi
          done

      - name: 结果总结
        if: always() && steps.check.outputs.should_run == 'true'
        run: |
          if [ "${{ steps.query.outputs.has_updates }}" != "true" ]; then
            echo "${{ matrix.app }}: 跳过 (所有平台均无可用版本)"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            PLATFORMS=$(echo '${{ steps.query.outputs.results }}' | jq -r '[.[].label] | join(", ")')
            echo "${{ matrix.app }}: Dry-run 完成 (${PLATFORMS})，未写入 CMS"
          else
            PLATFORMS=$(echo '${{ steps.query.outputs.results }}' | jq -r '[.[].label] | join(", ")')
            echo "${{ matrix.app }}: CMS 更新完成 (${PLATFORMS})"
          fi
