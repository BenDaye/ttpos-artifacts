name: "Test: CMS Update"

on:
  workflow_dispatch:
    inputs:
      app:
        description: "选择应用端 (仅含 CMS 配置的应用)"
        required: true
        type: choice
        options:
          - all
          - pos
          - kds
          - shop
          - assistant
          - tablet
        default: "all"
      platform:
        description: "选择平台"
        required: true
        type: choice
        options:
          - all
          - android
          - windows
          - macos
        default: "all"
      env:
        description: "选择频道/环境"
        required: true
        type: choice
        options:
          - "prod"
          - "test"
          - "dev"
        default: "test"
      dry_run:
        description: "Dry-run 模式：仅预览变更，不实际写入 CMS"
        required: true
        type: boolean
        default: true

jobs:
  update-cms:
    runs-on: ubuntu-latest
    env:
      STRAPI_URL: https://cms.hitosea.com
      STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
      FAYNOSYNC_URL: ${{ secrets.FAYNOSYNC_URL }}
    steps:
      - name: 显示测试参数
        run: |
          echo "========================================="
          echo "CMS 下载页更新测试"
          echo "========================================="
          echo "应用筛选:  ${{ inputs.app }}"
          echo "平台筛选:  ${{ inputs.platform }}"
          echo "频道:      ${{ inputs.env }}"
          echo "Dry-run:   ${{ inputs.dry_run }}"
          echo "========================================="

      - name: 检查 Secrets 配置
        run: |
          MISSING=""
          if [ -z "$STRAPI_TOKEN" ]; then MISSING="${MISSING} STRAPI_TOKEN"; fi
          if [ -z "$FAYNOSYNC_URL" ]; then MISSING="${MISSING} FAYNOSYNC_URL"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::缺少必要 Secrets:${MISSING}"
            exit 1
          fi
          echo "Secrets 检查通过"

      - name: 从 FaynoSync 查询所有应用的各平台下载信息
        id: query
        run: |
          CHANNEL="${{ inputs.env }}"

          ALL_APPS='[
            {"app":"pos",       "faynosync_name":"TTPOS",          "cms_title":"Cashier"},
            {"app":"kds",       "faynosync_name":"TTPOS Kitchen",  "cms_title":"KDS Kitchen"},
            {"app":"shop",      "faynosync_name":"TTPOS Shop",     "cms_title":"Shop"},
            {"app":"assistant", "faynosync_name":"TTPOS Go",       "cms_title":"Assistant"},
            {"app":"tablet",    "faynosync_name":"TTPOS Menu",     "cms_title":"Tablet Menu"}
          ]'

          ALL_PLATFORMS='[
            {"platform":"android","arch":"arm64","pkg_fmt":"apk","label":"Android"},
            {"platform":"windows","arch":"amd64","pkg_fmt":"exe","label":"Windows"},
            {"platform":"macos","arch":"arm64","pkg_fmt":"dmg","label":"MacOS"}
          ]'

          if [ "${{ inputs.app }}" != "all" ]; then
            APPS=$(echo "$ALL_APPS" | jq -c --arg a "${{ inputs.app }}" '[.[] | select(.app == $a)]')
          else
            APPS="$ALL_APPS"
          fi

          if [ "${{ inputs.platform }}" != "all" ]; then
            PLATFORMS=$(echo "$ALL_PLATFORMS" | jq -c --arg p "${{ inputs.platform }}" '[.[] | select(.platform == $p)]')
          else
            PLATFORMS="$ALL_PLATFORMS"
          fi

          echo "待查询应用: $(echo "$APPS" | jq -r '[.[].app] | join(", ")')"
          echo "待查询平台: $(echo "$PLATFORMS" | jq -r '[.[].label] | join(", ")')"

          RESULTS='[]'

          while IFS= read -r app_row; do
            APP_ID=$(echo "$app_row" | jq -r '.app')
            APP_NAME=$(echo "$app_row" | jq -r '.faynosync_name')
            CMS_TITLE=$(echo "$app_row" | jq -r '.cms_title')

            echo ""
            echo "========================================="
            echo "查询: ${APP_ID} (${APP_NAME} → ${CMS_TITLE})"
            echo "========================================="

            while IFS= read -r plat_row; do
              PLAT=$(echo "$plat_row" | jq -r '.platform')
              ARCH=$(echo "$plat_row" | jq -r '.arch')
              PKG=$(echo "$plat_row" | jq -r '.pkg_fmt')
              LABEL=$(echo "$plat_row" | jq -r '.label')

              echo "  --- ${LABEL} (${PLAT}/${ARCH}/${PKG}) ---"

              HEADERS=$(mktemp)
              DOWNLOAD_URL=$(curl -s -D "$HEADERS" -o /dev/null -w "%{redirect_url}" -G \
                "${FAYNOSYNC_URL}/apps/latest" \
                --data-urlencode "app_name=${APP_NAME}" \
                --data-urlencode "channel=${CHANNEL}" \
                --data-urlencode "platform=${PLAT}" \
                --data-urlencode "arch=${ARCH}" \
                --data-urlencode "package=${PKG}" \
                --data-urlencode "owner=ttpos")

              HTTP_CODE=$(head -1 "$HEADERS" | grep -oP '\d{3}')
              echo "  HTTP 状态: ${HTTP_CODE}"
              rm -f "$HEADERS"

              if [ -z "$DOWNLOAD_URL" ]; then
                echo "  ::warning::无版本，跳过"
                continue
              fi

              DOWNLOAD_URL=$(echo "$DOWNLOAD_URL" | \
                sed 's|https://storage.googleapis.com/|https://ttpos.com/storage_googleapis/|' | \
                sed 's| |%20|g')
              echo "  CMS 链接: ${DOWNLOAD_URL}"

              VER=$(echo "$DOWNLOAD_URL" | grep -oP '\d+\.\d+\.\d+' | tail -1)

              if [ -z "$VER" ]; then
                echo "  ::warning::无法从链接提取版本号，尝试 checkVersion API"
                RESP=$(curl -s --max-time 10 -G "${FAYNOSYNC_URL}/checkVersion" \
                  --data-urlencode "app_name=${APP_NAME}" \
                  --data-urlencode "version=0.0.0" \
                  --data-urlencode "channel=${CHANNEL}" \
                  --data-urlencode "platform=${PLAT}" \
                  --data-urlencode "arch=${ARCH}" \
                  --data-urlencode "owner=ttpos")

                echo "  checkVersion 响应:"
                echo "$RESP" | jq . 2>/dev/null || echo "$RESP"

                VER=$(echo "$RESP" | jq -r '
                  [to_entries[] | select(.key | startswith("update_url")) | .value] | first // ""
                ' | grep -oP '\d+\.\d+\.\d+' | head -1)
              fi

              if [ -z "$VER" ]; then
                echo "  ::warning::无法获取版本号，跳过"
                continue
              fi

              echo "  版本: V${VER}"

              RESULTS=$(echo "$RESULTS" | jq -c \
                --arg title "$CMS_TITLE" --arg label "$LABEL" --arg url "$DOWNLOAD_URL" --arg ver "$VER" \
                '. + [{"cms_title": $title, "label": $label, "url": $url, "version": $ver}]')
            done < <(echo "$PLATFORMS" | jq -c '.[]')
          done < <(echo "$APPS" | jq -c '.[]')

          COUNT=$(echo "$RESULTS" | jq 'length')
          echo ""
          echo "========================================="
          echo "查询汇总: ${COUNT} 个 app×platform 有可用版本"
          echo "$RESULTS" | jq -r '.[] | "  [\(.cms_title)] \(.label): V\(.version) → \(.url[0:80])..."'

          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::所有 app/平台均无可用版本"
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "results=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_updates=true" >> $GITHUB_OUTPUT
          echo "results=$(echo "$RESULTS" | jq -c '.')" >> $GITHUB_OUTPUT

      - name: 获取 CMS 当前数据
        id: cms_read
        if: steps.query.outputs.has_updates == 'true'
        run: |
          POPULATE="populate[items][populate][downloadButton]=*&populate[items][populate][downloadButtons]=*&populate[items][populate][thumbnail]=*&populate[items][populate][platforms]=*"

          HTTP_BODY=$(mktemp)
          HTTP_CODE=$(curl -g -s -o "$HTTP_BODY" -w "%{http_code}" \
            "${STRAPI_URL}/api/tt-pos-download?locale=en&${POPULATE}" \
            -H "Authorization: Bearer ${STRAPI_TOKEN}")

          echo "CMS API HTTP 状态: ${HTTP_CODE}"
          BODY_SIZE=$(wc -c < "$HTTP_BODY")
          echo "响应大小: ${BODY_SIZE} bytes"

          if [ "$HTTP_CODE" -ge 400 ] || [ "$BODY_SIZE" -lt 10 ]; then
            echo "::error::CMS API 请求失败 (HTTP ${HTTP_CODE}, ${BODY_SIZE} bytes)"
            cat "$HTTP_BODY" | head -c 2000
            rm -f "$HTTP_BODY"
            exit 1
          fi

          CMS_DATA=$(cat "$HTTP_BODY")
          rm -f "$HTTP_BODY"

          if ! echo "$CMS_DATA" | jq -e '.' > /dev/null 2>&1; then
            echo "::error::CMS 响应不是有效 JSON，前 500 字符:"
            echo "$CMS_DATA" | head -c 500
            exit 1
          fi

          echo ""
          echo "--- CMS 响应顶层结构 ---"
          echo "$CMS_DATA" | jq '{keys: keys, data_type: (.data | type), data_keys: (.data | if type == "object" then keys else "N/A" end)}'

          if echo "$CMS_DATA" | jq -e '.data.attributes.items' > /dev/null 2>&1; then
            echo "数据路径: .data.attributes.items (Strapi v4)"
          elif echo "$CMS_DATA" | jq -e '.data.items' > /dev/null 2>&1; then
            echo "数据路径: .data.items (Strapi v5)"
            echo "::warning::检测到 Strapi v5 结构，生产 workflow 使用 v4 路径，可能需要同步更新"
          else
            echo "::error::无法定位 items 数组"
            echo "--- 完整响应结构 (前 80 行) ---"
            echo "$CMS_DATA" | jq '.' | head -80
            exit 1
          fi

          ITEMS=$(echo "$CMS_DATA" | jq '.data.attributes.items // .data.items')

          echo ""
          echo "--- CMS 条目摘要 (共 $(echo "$ITEMS" | jq 'length') 条) ---"
          echo "$ITEMS" | jq -r '.[] |
            "  [\(.title)] ver=\(.version // "N/A") date=\(.releasedAt // "N/A") buttons=\([.downloadButtons[]? | "\(.label):\(.href[0:50])..."] | join(" | "))"
          '

          echo ""
          echo "--- CMS 完整响应 ---"
          echo "$CMS_DATA" | jq '.'

          echo "$CMS_DATA" > /tmp/cms_data.json

      - name: 生成更新 Payload 并对比
        id: payload
        if: steps.query.outputs.has_updates == 'true'
        env:
          PLATFORM_RESULTS: ${{ steps.query.outputs.results }}
        run: |
          CMS_DATA=$(cat /tmp/cms_data.json)

          UPDATED=$(echo "$CMS_DATA" | jq \
            --arg date "$(date +%Y-%m-%d)" \
            --argjson updates "$PLATFORM_RESULTS" \
            '
            ($updates | group_by(.cms_title) | map({
              key: .[0].cms_title,
              value: .
            }) | from_entries) as $by_title |

            (.data.attributes // .data) |
            del(.createdAt, .updatedAt, .publishedAt, .locale) |
            .localizations = [.localizations.data[]?.id] |
            .items |= map(
              .thumbnail = (if .thumbnail and .thumbnail.data then .thumbnail.data.id else null end) |
              .platforms = [.platforms[]? | {label}] |
              . as $item |
              if $by_title[$item.title] then
                ($by_title[$item.title]) as $item_updates |
                ($item_updates | map(.version) | unique | sort_by(split(".") | map(tonumber)) | last) as $ver |
                .version = "V\($ver)" |
                .releasedAt = $date |
                (.downloadButtons |= [.[] as $btn |
                  ($item_updates | map(select(.label == $btn.label)) | first // null) as $upd |
                  if $upd then ($btn | .href = $upd.url) else $btn end
                ]) |
                (($item_updates | map(select(.label == "Android")) | first // null) as $android |
                  if $android then .downloadButton.href = $android.url else . end)
              else . end
            ) |
            { data: . }
            ')

          echo "$UPDATED" > /tmp/cms_payload.json

          TITLES=$(echo "$PLATFORM_RESULTS" | jq -r '[.[].cms_title] | unique | join(", ")')
          echo "========================================="
          echo "变更摘要 (单次合并写入所有应用)"
          echo "========================================="
          echo "涉及应用: ${TITLES}"
          echo "日期:     $(date +%Y-%m-%d)"
          echo "更新明细:"
          echo "$PLATFORM_RESULTS" | jq -r '.[] | "  [\(.cms_title)] \(.label): V\(.version) → \(.url[0:80])..."'

          while IFS= read -r title; do
            echo ""
            echo "--- [${title}] 更新前 ---"
            cat /tmp/cms_data.json | jq --arg title "$title" \
              '(.data.attributes.items // .data.items)[] | select(.title == $title)'
            echo "--- [${title}] 更新后 ---"
            echo "$UPDATED" | jq --arg title "$title" \
              '.data.items[] | select(.title == $title)'
          done < <(echo "$PLATFORM_RESULTS" | jq -r '[.[].cms_title] | unique | .[]')

          echo ""
          echo "--- 完整 Payload ---"
          echo "$UPDATED" | jq '.'

      - name: 写入 CMS
        if: steps.query.outputs.has_updates == 'true' && inputs.dry_run == false
        run: |
          PAYLOAD=$(cat /tmp/cms_payload.json)

          HTTP_BODY=$(mktemp)
          HTTP_STATUS=$(curl -s -o "$HTTP_BODY" -w "%{http_code}" \
            -X PUT "${STRAPI_URL}/api/tt-pos-download?locale=en" \
            -H "Authorization: Bearer ${STRAPI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "HTTP 状态码: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "CMS 更新成功（所有应用一次性写入）"
          else
            echo "::error::CMS 更新失败 (HTTP ${HTTP_STATUS})"
            cat "$HTTP_BODY" | jq . 2>/dev/null || cat "$HTTP_BODY"
            exit 1
          fi
          rm -f "$HTTP_BODY"

      - name: 验证 CMS 更新结果
        if: steps.query.outputs.has_updates == 'true' && inputs.dry_run == false
        env:
          PLATFORM_RESULTS: ${{ steps.query.outputs.results }}
        run: |
          sleep 3

          POPULATE="populate[items][populate][downloadButton]=*&populate[items][populate][downloadButtons]=*&populate[items][populate][thumbnail]=*&populate[items][populate][platforms]=*"

          VERIFY=$(curl -g -s \
            "${STRAPI_URL}/api/tt-pos-download?locale=en&${POPULATE}" \
            -H "Authorization: Bearer ${STRAPI_TOKEN}")

          ALL_PASS=true

          while IFS= read -r title; do
            echo ""
            echo "--- 验证: ${title} ---"
            ITEM=$(echo "$VERIFY" | jq --arg title "$title" \
              '(.data.attributes.items // .data.items)[] | select(.title == $title)')

            EXPECTED_VER=$(echo "$PLATFORM_RESULTS" | jq -r --arg title "$title" \
              '[.[] | select(.cms_title == $title) | .version] | unique | sort_by(split(".") | map(tonumber)) | last')

            ACTUAL_VER=$(echo "$ITEM" | jq -r '.version')
            if [ "$ACTUAL_VER" = "V${EXPECTED_VER}" ]; then
              echo "版本号验证通过: ${ACTUAL_VER}"
            else
              echo "::warning::版本号不匹配 — 期望: V${EXPECTED_VER}, 实际: ${ACTUAL_VER}"
              ALL_PASS=false
            fi

            while IFS= read -r row; do
              LABEL=$(echo "$row" | jq -r '.label')
              EXPECTED_URL=$(echo "$row" | jq -r '.url')

              ACTUAL_BTN=$(echo "$ITEM" | jq -r --arg label "$LABEL" \
                '.downloadButtons[]? | select(.label == $label) | .href')
              if [ "$ACTUAL_BTN" = "$EXPECTED_URL" ]; then
                echo "${LABEL} 下载链接验证通过"
              else
                echo "::warning::${LABEL} 下载链接不匹配 — 期望: ${EXPECTED_URL}, 实际: ${ACTUAL_BTN}"
                ALL_PASS=false
              fi
            done < <(echo "$PLATFORM_RESULTS" | jq -c --arg title "$title" '.[] | select(.cms_title == $title)')
          done < <(echo "$PLATFORM_RESULTS" | jq -r '[.[].cms_title] | unique | .[]')

          if [ "$ALL_PASS" = "true" ]; then
            echo ""
            echo "所有验证通过"
          fi

      - name: 结果总结
        if: always()
        run: |
          if [ "${{ steps.query.outputs.has_updates }}" != "true" ]; then
            echo "所有 app/平台均无可用版本，未执行更新"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry-run 完成，未写入 CMS。更新明细:"
            echo '${{ steps.query.outputs.results }}' | jq -r '.[] | "  [\(.cms_title)] \(.label): V\(.version)"'
          else
            echo "CMS 更新完成。更新明细:"
            echo '${{ steps.query.outputs.results }}' | jq -r '.[] | "  [\(.cms_title)] \(.label): V\(.version)"'
          fi
