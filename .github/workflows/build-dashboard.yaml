name: "Build: Dashboard"

on:
  workflow_dispatch:
  push:
    branches: [main, release]
    # 仅匹配 bump-version.ts 打出的版本 tag；paths 对 tag 推送不生效（GitHub 官方行为），
    # 故 tag 必触发打包。分支推送不再用 paths 过滤（ENH-017）：改由 affected
    # 预检 job 按 turbo 依赖图判定质量门跑不跑，手写 paths 表达不了传递依赖
    # （改 packages/shared 应带跑 web）且 packages/** 是粗暴全触发。
    tags:
      - "web-v*"

jobs:
  # ENH-017：轻量预检（~30s，无需 bun install）。turbo ls --affected 按
  # git base + 依赖图列出受影响的包；e2e/、playwright/eslint 根配置和本
  # workflow 文件不在 turbo 包图内，用 git diff 兜底。
  affected:
    runs-on: ubuntu-latest
    outputs:
      run_gates: ${{ steps.check.outputs.run_gates }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # --affected 需要完整历史才能与 push 前的 base commit 比对
          fetch-depth: 0

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: 判定 @ttpos/web 是否受影响
        id: check
        env:
          BASE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          # tag 推送 / 手动触发 / base 不可用（新分支首推、force-push）→ 保守全跑
          if [[ "${{ github.ref_type }}" == "tag" || "${{ github.event_name }}" != "push" ]] \
             || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run_gates=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # turbo 版本与根 package.json devDependencies 保持一致（预检不装依赖，走 bunx 直取）
          affected_json=$(TURBO_SCM_BASE="$BASE" bunx turbo@2.10.3 ls --affected --output=json 2>/dev/null) || affected_json=''
          # turbo 异常时 fail-open：宁可多跑质量门，不可漏跑
          if [[ -z "$affected_json" ]]; then
            echo "run_gates=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if jq -e '.packages.items[] | select(.name == "@ttpos/web")' <<<"$affected_json" > /dev/null \
             || git diff --name-only "$BASE"..HEAD | grep -qE '^(e2e/|playwright\.config\.ts|eslint\.config\.js|\.github/workflows/build-dashboard\.yaml)'; then
            echo "run_gates=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_gates=false" >> "$GITHUB_OUTPUT"
          fi

  quality-gates:
    needs: affected
    if: needs.affected.outputs.run_gates == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: 恢复 Turbo 缓存
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          # 命中不到精确 key 时回退最近一次缓存，turbo 再按 inputs 增量判定
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bunx turbo typecheck --filter=@ttpos/web --filter=@ttpos/shared

      - name: ESLint
        run: bun run lint

      - name: 单元测试
        run: bunx turbo test --filter=@ttpos/web

      - name: 生产构建
        run: bunx turbo build --filter=@ttpos/web

      - name: 安装 Playwright 浏览器
        run: bun x playwright install --with-deps chromium

      - name: E2E 烟测
        run: bun run test:e2e

      - name: 上传 E2E 报告
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: dashboard-playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    needs: [quality-gates]
    # 仅在打了 web-v* tag 时才打包推镜像；分支推送只跑质量门。
    # 手动 workflow_dispatch 若选择 tag ref 也会打包，选分支则只验证。
    if: startsWith(github.ref, 'refs/tags/web-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ttpos-web
    steps:
      - name: 显示构建信息
        run: |
          echo "========================================="
          echo "Dashboard 构建信息"
          echo "========================================="
          echo "Ref: ${{ github.ref_name }}"
          echo "触发: ${{ github.event_name }}"
          echo "镜像: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}"
          echo "========================================="

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取 Commit 信息
        id: git_info
        run: |
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "COMMIT_MSG=$(git log -1 --pretty=format:%s)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          # 关闭隐式 latest：type=match 在 tag 事件下会因 flavor.latest=auto（默认）再隐式加一个
          # latest，与下方显式 type=raw,value=latest 重复。latest=false 关掉隐式，只保留显式一个。
          flavor: |
            latest=false
          # 从 web-v0.3.0 提取版本号 0.3.0；release tag 同时更新 latest，并附 commit sha。
          tags: |
            type=match,pattern=web-v(.*),group=1
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ steps.git_info.outputs.COMMIT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          platforms: linux/amd64

      - name: 构建完成总结
        if: always()
        run: |
          echo "========================================="
          echo "Dashboard 构建完成"
          echo "========================================="
          echo "Commit: ${{ steps.git_info.outputs.COMMIT_SHA }}"
          echo "镜像标签:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "========================================="
