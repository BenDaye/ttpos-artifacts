name: Auto Build on Test Build

on:
  repository_dispatch:
    types: [test-build]
  workflow_dispatch:
    inputs:
      branch:
        description: "构建分支"
        required: true
        type: string
        default: "new-test"
      env:
        description: "选择构建环境"
        required: true
        type: choice
        options:
          - "test"
          - "dev"
        default: "test"
      package:
        description: "选择要构建的应用端"
        required: true
        type: choice
        options:
          - all
          - pos
          - shop
          - kds
          - qds
          - assistant
          - tablet
          - kiosk
          - mobile
          - menu
          - member
        default: "all"
      platform:
        description: "选择构建平台"
        required: true
        type: choice
        options:
          - all
          - android
          - windows
          - web
          - macos
          - ios
        default: "all"
      base_url:
        description: "选择API基础URL"
        required: true
        type: choice
        default: "https://ttpos-test1.ttpos.com/api/v1"
        options:
          - "https://ttpos-test1.ttpos.com/api/v1"
          - "https://api.ttpos.com/api/v1"
          - "https://ttpos-pro.keli.vip/api/v1"
      base_ws_url:
        description: "选择WebSocket基础URL"
        required: true
        type: choice
        default: "wss://ttpos-test1.ttpos.com/ws"
        options:
          - "wss://ttpos-test1.ttpos.com/ws"
          - "wss://api.ttpos.com/ws"
          - "wss://ttpos-pro.keli.vip/ws"
      scp:
        description: "是否启用SCP传输"
        required: true
        type: choice
        options:
          - "on"
          - "off"
        default: "off"
      faynosync:
        description: "FaynoSync 上传模式 (on=检查版本已存在则跳过, force=强制覆盖)"
        required: false
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
          - "force"

permissions:
  actions: write

concurrency:
  group: test-build-${{ github.event.client_payload.branch || inputs.branch || 'new-test' }}
  cancel-in-progress: true

jobs:
  trigger-builds:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ inputs.branch || github.event.client_payload.branch || 'new-test' }}
      BUILD_ENV: ${{ inputs.env || github.event.client_payload.env || 'test' }}
      BASE_URL: ${{ inputs.base_url || github.event.client_payload.base_url || 'https://ttpos-test1.ttpos.com/api/v1' }}
      BASE_WS_URL: ${{ inputs.base_ws_url || github.event.client_payload.base_ws_url || 'wss://ttpos-test1.ttpos.com/ws' }}
      PACKAGE: ${{ inputs.package || github.event.client_payload.package || 'all' }}
      PLATFORM: ${{ inputs.platform || github.event.client_payload.platform || 'all' }}
      SCP: ${{ inputs.scp || github.event.client_payload.scp || 'off' }}
      FAYNOSYNC: ${{ inputs.faynosync || github.event.client_payload.faynosync || 'force' }}
    steps:
      - name: 显示构建参数
        run: |
          echo "========================================="
          echo "测试构建参数"
          echo "========================================="
          echo "分支: ${{ env.BRANCH }}"
          echo "环境: ${{ env.BUILD_ENV }}"
          echo "应用端: ${{ env.PACKAGE }}"
          echo "平台: ${{ env.PLATFORM }}"
          echo "API URL: ${{ env.BASE_URL }}"
          echo "WS URL: ${{ env.BASE_WS_URL }}"
          echo "SCP: ${{ env.SCP }}"
          echo "FaynoSync: ${{ env.FAYNOSYNC }}"
          echo "========================================="

      - name: 触发 Android 构建
        if: env.PLATFORM == 'all' || env.PLATFORM == 'android'
        run: |
          gh workflow run build-android.yaml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            -f branch=${{ env.BRANCH }} \
            -f env=${{ env.BUILD_ENV }} \
            -f package=${{ env.PACKAGE }} \
            -f base_url=${{ env.BASE_URL }} \
            -f base_ws_url=${{ env.BASE_WS_URL }} \
            -f scp=${{ env.SCP }} \
            -f faynosync=${{ env.FAYNOSYNC }}

      - name: 触发 iOS 构建
        if: env.PLATFORM == 'all' || env.PLATFORM == 'ios'
        run: |
          gh workflow run build-ios.yaml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            -f branch=${{ env.BRANCH }} \
            -f env=${{ env.BUILD_ENV }} \
            -f package=${{ env.PACKAGE }} \
            -f base_url=${{ env.BASE_URL }} \
            -f base_ws_url=${{ env.BASE_WS_URL }} \
            -f faynosync=${{ env.FAYNOSYNC }}

      - name: 触发 Windows 构建
        if: env.PLATFORM == 'all' || env.PLATFORM == 'windows'
        run: |
          gh workflow run build-windows.yaml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            -f branch=${{ env.BRANCH }} \
            -f env=${{ env.BUILD_ENV }} \
            -f package=${{ env.PACKAGE }} \
            -f base_url=${{ env.BASE_URL }} \
            -f base_ws_url=${{ env.BASE_WS_URL }} \
            -f scp=${{ env.SCP }} \
            -f faynosync=${{ env.FAYNOSYNC }}

      - name: 触发 macOS 构建
        if: env.PLATFORM == 'all' || env.PLATFORM == 'macos'
        run: |
          gh workflow run build-macos.yaml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            -f branch=${{ env.BRANCH }} \
            -f env=${{ env.BUILD_ENV }} \
            -f package=${{ env.PACKAGE }} \
            -f base_url=${{ env.BASE_URL }} \
            -f base_ws_url=${{ env.BASE_WS_URL }} \
            -f scp=${{ env.SCP }} \
            -f faynosync=${{ env.FAYNOSYNC }}

      - name: 触发 Web 构建
        if: env.PLATFORM == 'all' || env.PLATFORM == 'web'
        run: |
          gh workflow run build-web.yaml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref }} \
            -f branch=${{ env.BRANCH }} \
            -f env=${{ env.BUILD_ENV }} \
            -f package=${{ env.PACKAGE }} \
            -f base_url=${{ env.BASE_URL }} \
            -f base_ws_url=${{ env.BASE_WS_URL }}

      - name: 构建触发完成
        run: |
          echo "========================================="
          echo "所有构建已触发"
          echo "========================================="
          echo "请到 Actions 页面查看各平台构建进度"
          echo "========================================="
