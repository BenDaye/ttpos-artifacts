name: 测试 ASC API Key

on:
  workflow_dispatch:

jobs:
  test-asc-key:
    name: 验证 App Store Connect API Key
    runs-on: ubuntu-latest
    steps:
      - name: 检查 Secrets 是否已配置
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          PASS=true

          echo "========================================="
          echo "检查 ASC Secrets 配置"
          echo "========================================="

          if [ -z "${ASC_API_KEY_ID}" ]; then
            echo "::error::❌ ASC_API_KEY_ID 未配置"
            PASS=false
          else
            echo "✅ ASC_API_KEY_ID 已配置 (${#ASC_API_KEY_ID} 字符)"
          fi

          if [ -z "${ASC_ISSUER_ID}" ]; then
            echo "::error::❌ ASC_ISSUER_ID 未配置"
            PASS=false
          else
            echo "✅ ASC_ISSUER_ID 已配置 (${#ASC_ISSUER_ID} 字符)"
          fi

          if [ -z "${ASC_API_KEY_BASE64}" ]; then
            echo "::error::❌ ASC_API_KEY_BASE64 未配置"
            PASS=false
          else
            echo "✅ ASC_API_KEY_BASE64 已配置 (${#ASC_API_KEY_BASE64} 字符)"
          fi

          if [ "$PASS" = "false" ]; then
            echo ""
            echo "::error::缺少必要的 Secrets，请先配置后再运行"
            exit 1
          fi
          echo "========================================="

      - name: 解码并验证 .p8 密钥格式
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail

          echo "解码 .p8 密钥..."
          KEY_DIR="$RUNNER_TEMP/asc_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"

          echo "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"

          if [ ! -s "$KEY_PATH" ]; then
            echo "::error::❌ 解码后的 .p8 文件为空，base64 编码可能有误"
            exit 1
          fi
          echo "✅ Base64 解码成功 ($(wc -c < "$KEY_PATH") 字节)"

          HEAD=$(head -1 "$KEY_PATH")
          TAIL=$(tail -1 "$KEY_PATH")
          if [[ "$HEAD" == *"BEGIN PRIVATE KEY"* ]] && [[ "$TAIL" == *"END PRIVATE KEY"* ]]; then
            echo "✅ .p8 密钥格式正确 (PKCS#8 PEM)"
          else
            echo "::error::❌ .p8 密钥格式异常，首行: ${HEAD:0:30}..."
            echo "期望首行包含 'BEGIN PRIVATE KEY'，末行包含 'END PRIVATE KEY'"
            exit 1
          fi

          openssl ec -in "$KEY_PATH" -noout 2>/dev/null && echo "✅ EC 私钥解析成功 (P-256)" || {
            echo "::error::❌ 无法解析为 EC 私钥，文件可能损坏或不完整"
            exit 1
          }

          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: 安装 Python 依赖
        run: pip install PyJWT cryptography

      - name: 生成 JWT 并调用 ASC API
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail

          python3 << 'PYEOF'
          import jwt, time, json, urllib.request, urllib.error, os, sys

          key_id    = os.environ["ASC_API_KEY_ID"]
          issuer_id = os.environ["ASC_ISSUER_ID"]
          key_path  = os.environ["KEY_PATH"]

          with open(key_path, "r") as f:
              private_key = f.read()

          now = int(time.time())
          payload = {
              "iss": issuer_id,
              "iat": now,
              "exp": now + 1200,
              "aud": "appstoreconnect-v1",
          }
          headers = {
              "kid": key_id,
              "typ": "JWT",
          }

          print("生成 JWT Token...")
          token = jwt.encode(payload, private_key, algorithm="ES256", headers=headers)
          print(f"✅ JWT 生成成功 (长度: {len(token)} 字符)")

          def call_api(path, description):
              url = f"https://api.appstoreconnect.apple.com{path}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              })
              print(f"\n{'='*50}")
              print(f"测试: {description}")
              print(f"GET {url}")
              print("=" * 50)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      status = resp.status
                      data = json.loads(resp.read())
                      return status, data, None
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  try:
                      data = json.loads(body)
                  except Exception:
                      data = {"raw": body}
                  return e.code, data, e

          # --- Test 1: 列出 Apps ---
          status, data, err = call_api("/v1/apps?limit=5", "列出 Apps（验证认证 + App Manager 读取权限）")
          if err:
              errors = data.get("errors", [{}])
              detail = errors[0].get("detail", json.dumps(data, ensure_ascii=False)) if errors else str(data)
              print(f"❌ HTTP {status}: {detail}")
              if status == 401:
                  print("\n可能原因:")
                  print("  - ASC_API_KEY_ID 与 .p8 文件不匹配")
                  print("  - ASC_ISSUER_ID 不正确")
                  print("  - API Key 已被撤销")
              elif status == 403:
                  print("\n可能原因:")
                  print("  - API Key 权限不足 (当前角色可能不是 App Manager)")
                  print("  - 请检查 App Store Connect 中的 Key 角色设置")
              sys.exit(1)

          apps = data.get("data", [])
          total = data.get("meta", {}).get("paging", {}).get("total", len(apps))
          print(f"✅ HTTP {status} — 认证成功!")
          print(f"   共 {total} 个 App:")
          for app in apps:
              attrs = app.get("attributes", {})
              name = attrs.get("name", "未知")
              bundle_id = attrs.get("bundleId", "未知")
              sku = attrs.get("sku", "")
              print(f"   • {name} ({bundle_id}) SKU={sku}")

          # --- Test 2: 列出 Bundle IDs ---
          status2, data2, err2 = call_api("/v1/bundleIds?limit=10", "列出 Bundle IDs（验证开发者资源访问）")
          if err2:
              print(f"⚠️  HTTP {status2}: 无法列出 Bundle IDs（可能是权限范围限制，不影响 TestFlight 上传）")
          else:
              bundles = data2.get("data", [])
              total2 = data2.get("meta", {}).get("paging", {}).get("total", len(bundles))
              print(f"✅ HTTP {status2} — 共 {total2} 个 Bundle ID:")
              for b in bundles:
                  attrs = b.get("attributes", {})
                  identifier = attrs.get("identifier", "未知")
                  name = attrs.get("name", "")
                  platform = attrs.get("platform", "")
                  print(f"   • {identifier} ({name}) [{platform}]")

          # --- Test 3: 列出构建 (验证 TestFlight 相关权限) ---
          status3, data3, err3 = call_api("/v1/builds?limit=3&sort=-uploadedDate", "列出最近构建（验证 TestFlight 权限）")
          if err3:
              print(f"⚠️  HTTP {status3}: 无法列出构建记录（可能尚未上传过构建）")
          else:
              builds = data3.get("data", [])
              total3 = data3.get("meta", {}).get("paging", {}).get("total", len(builds))
              print(f"✅ HTTP {status3} — 共 {total3} 个构建:")
              for bld in builds:
                  attrs = bld.get("attributes", {})
                  version = attrs.get("version", "?")
                  uploaded = attrs.get("uploadedDate", "?")
                  state = attrs.get("processingState", "?")
                  print(f"   • Build {version} — 状态: {state}, 上传: {uploaded}")

          print(f"\n{'='*50}")
          print("🎉 全部测试通过! ASC API Key 配置正确，App Manager 权限验证成功。")
          print("=" * 50)
          PYEOF

      - name: 清理密钥文件
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc_keys" 2>/dev/null || true
