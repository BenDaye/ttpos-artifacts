name: "Build: Windows"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "构建分支 (e.g. release, new-test, feature/xxx)"
        required: true
        type: string
        default: "release"
      env:
        description: "选择构建环境"
        required: true
        type: choice
        options:
          - "prod"
          - "test"
          - "dev"
        default: "prod"
      package:
        description: "选择要构建的应用端"
        required: true
        type: choice
        options:
          - all
          - pos
          - kds
          - assistant
          - tablet
          - shop
          - kiosk
        default: "all"
      base_url:
        description: "API基础URL"
        required: true
        type: string
        default: "https://api.ttpos.com/api/v1"
      base_ws_url:
        description: "WebSocket基础URL"
        required: true
        type: string
        default: "wss://api.ttpos.com/ws"
      faynosync:
        description: "FaynoSync 上传模式 (on=上传, force=覆盖上传)"
        required: false
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
          - "force"

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: 限制 prod 构建触发人
        if: ${{ inputs.env == 'prod' }}
        env:
          ACTOR: ${{ github.actor }}
        run: |
          # 只有 tc(qiuxiang)和 Ben(BenDaye)可触发 env=prod 构建。
          # github-actions[bot] 放行: 经 auto-build 编排 / 自动 release-push 触发的子构建(其入口已在 auto-build 处把关)。
          ALLOWED="qiuxiang BenDaye github-actions[bot]"
          for u in $ALLOWED; do
            if [ "$ACTOR" = "$u" ]; then
              echo "授权通过: $ACTOR"
              exit 0
            fi
          done
          echo "::error::env=prod 仅允许 tc(qiuxiang) / Ben(BenDaye) 触发, 当前触发人: $ACTOR"
          exit 1

  build:
    needs: authorize
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        package: [pos, kds, assistant, tablet, shop, kiosk]
        include:
          - package: pos
            exe_prefix: "TTPOS"
            faynosync_name: "TTPOS"
          - package: kds
            exe_prefix: "TTPOS-Kitchen"
            faynosync_name: "TTPOS Kitchen"
          - package: assistant
            exe_prefix: "TTPOS-Go"
            faynosync_name: "TTPOS Go"
          - package: tablet
            exe_prefix: "TTPOS-Menu"
            faynosync_name: "TTPOS Menu"
          - package: shop
            exe_prefix: "TTPOS-Shop"
            faynosync_name: "TTPOS Shop"
          - package: kiosk
            exe_prefix: "TTPOS-Kiosk"
            faynosync_name: "TTPOS Kiosk"
    env:
      output_path: releases
      FAYNOSYNC_PUBLISH: ${{ inputs.branch == 'new-test' && inputs.env == 'test' }}
      # MSVC 14.51 (VS18) 把 <experimental/coroutine> 弃用警告升级为硬错误 (STL1011)，
      # audioplayers_windows / flutter_tts / permission_handler_windows 仍在用该头文件。
      # 通过 CL 全局注入宏抑制该错误，待上游插件迁移到 C++20 <coroutine> 后可移除。
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - name: 检查是否需要构建此应用端
        id: check
        shell: pwsh
        run: |
          if ("${{ inputs.package }}" -eq "all" -or "${{ inputs.package }}" -eq "${{ matrix.package }}") {
            echo "should_run=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "跳过 ${{ matrix.package }} (选择的应用端: ${{ inputs.package }})"
            echo "should_run=false" >> $env:GITHUB_OUTPUT
          }

      - name: 显示构建信息
        if: steps.check.outputs.should_run == 'true'
        run: |
          Write-Host "========================================="
          Write-Host "构建信息"
          Write-Host "========================================="
          Write-Host "应用端: ${{ matrix.package }}"
          Write-Host "分支: ${{ inputs.branch }}"
          Write-Host "环境: ${{ inputs.env }}"
          Write-Host "API URL: ${{ inputs.base_url }}"
          Write-Host "WebSocket URL: ${{ inputs.base_ws_url }}"
          Write-Host "========================================="

      - name: Checkout the code
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Setup Flutter
        if: steps.check.outputs.should_run == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: 配置 MELOS_SDK_PATH
        if: steps.check.outputs.should_run == 'true'
        shell: bash
        run: |
          SDK_PATH=$(dirname "$(dirname "$(command -v flutter)")")
          echo "MELOS_SDK_PATH=$(cygpath -w "$SDK_PATH")" >> "$GITHUB_ENV"

      - name: Install Melos
        if: steps.check.outputs.should_run == 'true'
        run: |
          flutter --version
          dart --version
          dart pub global activate melos

      - name: Melos Init
        if: steps.check.outputs.should_run == 'true'
        run: |
          melos bs
          melos run env:setup -- --env=${{ inputs.env }} --file=${{ inputs.env }}

      - name: 生成环境变量文件
        if: steps.check.outputs.should_run == 'true'
        shell: pwsh
        run: |
          $pkgName = "${{ matrix.package }}"
          if (-not $pkgName) {
            Write-Error "错误：包名 (package) 为空."
            exit 1
          }

          # 根据 env 输入选择对应的环境文件(与 scripts/utils.dart getEnv() 保持一致)
          $envSuffix = switch ("${{ inputs.env }}") {
            "dev"  { "development" }
            "test" { "test" }
            default { "production" }
          }

          $envDir = "apps/$pkgName"
          $envPath = "$envDir/.env.$envSuffix.local"
          $envTemplate = "$envDir/.env.$envSuffix"

          if (-not (Test-Path $envPath)) {
            if (Test-Path $envTemplate) {
              Copy-Item $envTemplate $envPath
            } else {
              New-Item -ItemType File -Path $envPath -Force
            }
          }

          $api_url = "${{ inputs.base_url }}"
          $ws_url = "${{ inputs.base_ws_url }}"

          (Get-Content $envPath) -replace '^API_BASE_URL=.*', "API_BASE_URL=$api_url" | Set-Content $envPath
          (Get-Content $envPath) -replace '^WS_BASE_URL=.*', "WS_BASE_URL=$ws_url" | Set-Content $envPath

          # 保存 envSuffix 供后续步骤使用
          echo "ENV_SUFFIX=$envSuffix" >> $env:GITHUB_ENV

          Write-Host "--- 环境变量文件内容 ($envPath) ---"
          Get-Content $envPath

      - name: 设置 SENTRY_DSN(仅 release 分支)
        if: steps.check.outputs.should_run == 'true' && inputs.branch == 'release'
        shell: pwsh
        run: |
          $envPath = "apps/${{ matrix.package }}/.env.${{ env.ENV_SUFFIX }}.local"
          $dsn = switch ("${{ matrix.package }}") {
            "pos" { "${{ secrets.SENTRYDSN_POS }}" }
            "assistant" { "${{ secrets.SENTRYDSN_ASSISTANT }}" }
            "tablet" { "${{ secrets.SENTRYDSN_TABLET }}" }
            "kds" { "${{ secrets.SENTRYDSN_KDS }}" }
            "shop" { "${{ secrets.SENTRYDSN_SHOP }}" }
            "kiosk" { "${{ secrets.SENTRYDSN_KIOSK }}" }
            default { "" }
          }
          if ($dsn -ne "") {
            (Get-Content $envPath) -replace '^SENTRY_DSN=.*', "SENTRY_DSN=$dsn" | Set-Content $envPath
            Write-Host "已设置 SENTRY_DSN 到 $envPath"
          }

      - name: 设置环境变量
        if: steps.check.outputs.should_run == 'true'
        run: |
          $env:MELOS_PACKAGE_NAME = "${{ matrix.package }}"
          $version = (Get-Content apps/${{ matrix.package }}/pubspec.yaml | Select-String 'version:' | ForEach-Object { $_.Line.Split(':')[1].Trim() }).Split('+')[0]
          $env:MELOS_PACKAGE_VERSION = $version
          echo "MELOS_PACKAGE_NAME=$env:MELOS_PACKAGE_NAME" >> $env:GITHUB_ENV
          echo "MELOS_PACKAGE_VERSION=$env:MELOS_PACKAGE_VERSION" >> $env:GITHUB_ENV

          echo "FS_VERSION=$version" >> $env:GITHUB_ENV

      - name: FaynoSync 上传预检查
        if: steps.check.outputs.should_run == 'true' && inputs.faynosync != 'off'
        shell: bash
        env:
          FAYNOSYNC_URL: ${{ secrets.FAYNOSYNC_URL }}
          FAYNOSYNC_TOKEN: ${{ secrets.FAYNOSYNC_TOKEN }}
        run: |
          CHANNEL="${{ inputs.env }}"
          OVERWRITE=false
          if [ "${{ inputs.faynosync }}" = "force" ]; then
            OVERWRITE=true
          fi

          if [ -z "$FAYNOSYNC_URL" ] || [ -z "$FAYNOSYNC_TOKEN" ]; then
            echo "::error::已启用 FaynoSync，但未配置 FAYNOSYNC_URL 或 FAYNOSYNC_TOKEN"
            exit 1
          fi

          echo "预检查 FaynoSync: ${{ matrix.faynosync_name }} v${FS_VERSION} (${CHANNEL}/windows/amd64/.exe, overwrite=${OVERWRITE})"
          HTTP_CODE=$(curl -sS -o /tmp/faynosync_preflight.json -w "%{http_code}" -G "${FAYNOSYNC_URL}/upload/check" \
            -H "Authorization: Bearer ${FAYNOSYNC_TOKEN}" \
            --data-urlencode "app_name=${{ matrix.faynosync_name }}" \
            --data-urlencode "version=${FS_VERSION}" \
            --data-urlencode "channel=${CHANNEL}" \
            --data-urlencode "platform=windows" \
            --data-urlencode "arch=amd64" \
            --data-urlencode "package=.exe" \
            --data-urlencode "overwrite=${OVERWRITE}")
          RESP=$(cat /tmp/faynosync_preflight.json 2>/dev/null)
          echo "HTTP ${HTTP_CODE}: ${RESP}"
          if [ "$HTTP_CODE" = "409" ]; then
            echo "::error::FaynoSync 已存在 ${{ matrix.faynosync_name }} v${FS_VERSION} (${CHANNEL}/windows/amd64/.exe)。如需覆盖请选择 faynosync=force"
            exit 1
          fi
          if [ "$HTTP_CODE" != "204" ]; then
            echo "::error::FaynoSync 预检查失败 (HTTP ${HTTP_CODE}): ${RESP}"
            exit 1
          fi
          echo "FaynoSync 预检查通过"

      - name: 构建 Windows 安装包
        if: steps.check.outputs.should_run == 'true'
        run: |
          dart run ./scripts/build_win_innosetup.dart --env=${{ inputs.env }} --package=${{ matrix.package }}

      - name: 检查构建产物
        if: steps.check.outputs.should_run == 'true'
        run: |
          $exeName = "${{ matrix.exe_prefix }}-$env:MELOS_PACKAGE_VERSION.exe"
          $exePath = ".\releases\${{ matrix.package }}\$env:MELOS_PACKAGE_VERSION\$exeName"
          if (-not (Test-Path $exePath)) {
            Write-Error "未找到构建产物: $exePath"
            exit 1
          }
          Write-Host "构建产物存在: $exePath"
          $fileInfo = Get-Item $exePath
          Write-Host "文件大小: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"

      - name: 上传构建产物到 Artifact
        if: steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.exe_prefix }}-${{ env.MELOS_PACKAGE_VERSION }}
          path: releases/${{ matrix.package }}/${{ env.MELOS_PACKAGE_VERSION }}/
          retention-days: 7
          compression-level: 0

      - name: 上传到 FaynoSync
        id: faynosync
        if: steps.check.outputs.should_run == 'true' && inputs.faynosync != 'off'
        shell: bash
        env:
          FAYNOSYNC_URL: ${{ secrets.FAYNOSYNC_URL }}
          FAYNOSYNC_TOKEN: ${{ secrets.FAYNOSYNC_TOKEN }}
        run: |
          FILE_PATH="releases/${{ matrix.package }}/${MELOS_PACKAGE_VERSION}/${{ matrix.exe_prefix }}-${MELOS_PACKAGE_VERSION}.exe"
          if [ ! -f "$FILE_PATH" ]; then
            echo "构建产物不存在，跳过 FaynoSync 上传"
            exit 0
          fi

          CHANNEL="${{ inputs.env }}"

          OVERWRITE_FIELD=""
          if [ "${{ inputs.faynosync }}" = "force" ]; then
            OVERWRITE_FIELD=',"overwrite":true'
          fi

          if [ -z "$FAYNOSYNC_URL" ] || [ -z "$FAYNOSYNC_TOKEN" ]; then
            echo "::error::已启用 FaynoSync，但未配置 FAYNOSYNC_URL 或 FAYNOSYNC_TOKEN"
            exit 1
          fi

          echo "上传到 FaynoSync: ${{ matrix.faynosync_name }} v${FS_VERSION} (${CHANNEL}/windows/amd64)"
          HTTP_CODE=$(curl -s -o /tmp/faynosync_resp.json -w "%{http_code}" -X POST "${FAYNOSYNC_URL}/upload" \
            -H "Authorization: Bearer ${FAYNOSYNC_TOKEN}" \
            -F "file=@${FILE_PATH}" \
            -F "data={\"app_name\":\"${{ matrix.faynosync_name }}\",\"version\":\"${FS_VERSION}\",\"channel\":\"${CHANNEL}\",\"publish\":${{ env.FAYNOSYNC_PUBLISH }},\"critical\":false,\"platform\":\"windows\",\"arch\":\"amd64\",\"changelog\":\"Build from ${{ inputs.branch }}\"${OVERWRITE_FIELD}}")
          RESP=$(cat /tmp/faynosync_resp.json 2>/dev/null)
          echo "HTTP ${HTTP_CODE}: ${RESP}"
          if [[ "$HTTP_CODE" != 2* ]]; then
            echo "::error::FaynoSync 上传失败 (HTTP ${HTTP_CODE}): ${RESP}"
            exit 1
          fi
          echo "uploaded=true" >> $GITHUB_OUTPUT
          echo "FaynoSync 上传完成"

      - name: 构建完成总结
        if: always() && steps.check.outputs.should_run == 'true'
        run: |
          Write-Host "========================================="
          Write-Host "构建任务完成"
          Write-Host "========================================="
          Write-Host "应用端: ${{ matrix.package }}"
          Write-Host "版本: $env:MELOS_PACKAGE_VERSION"
          Write-Host "分支: ${{ inputs.branch }}"
          Write-Host "环境: ${{ inputs.env }}"
          Write-Host "========================================="
