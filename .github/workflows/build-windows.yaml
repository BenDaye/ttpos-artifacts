name: Build Windows Inno Setup

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "构建分支 (e.g. release, new-test, feature/xxx)"
        required: true
        type: string
        default: "new-test"
      env:
        description: "选择构建环境"
        required: true
        type: choice
        options:
          - "prod"
          - "test"
          - "dev"
        default: "test"
      package:
        description: "选择要构建的应用端"
        required: true
        type: choice
        options:
          - all
          - pos
          - kds
          - assistant
          - tablet
          - shop
          - kiosk
        default: "all"
      base_url:
        description: "选择API基础URL"
        required: true
        type: choice
        default: "https://ttpos-test1.ttpos.com/api/v1"
        options:
          - "https://ttpos-test1.ttpos.com/api/v1"
          - "https://api.ttpos.com/api/v1"
          - "https://ttpos-pro.keli.vip/api/v1"
      base_ws_url:
        description: "选择WebSocket基础URL"
        required: true
        type: choice
        default: "wss://ttpos-test1.ttpos.com/ws"
        options:
          - "wss://ttpos-test1.ttpos.com/ws"
          - "wss://api.ttpos.com/ws"
          - "wss://ttpos-pro.keli.vip/ws"
      updater_url:
        description: "自定义更新服务URL (覆盖 UPDATER_URL)"
        required: false
        type: string
      updater_owner:
        description: "自定义更新服务Owner (覆盖 UPDATER_OWNER)"
        required: false
        type: string
      updater_channel:
        description: "自定义更新频道 (覆盖 UPDATER_CHANNEL)"
        required: false
        type: choice
        options:
          - ""
          - "prod"
          - "test"
          - "dev"
      scp:
        description: "是否启用SCP传输"
        required: true
        default: "off"
        type: choice
        options:
          - "on"
          - "off"
      faynosync:
        description: "FaynoSync 上传模式 (on=检查版本已存在则跳过, force=强制覆盖)"
        required: false
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
          - "force"
      update_cms:
        description: "是否更新 CMS 下载页"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        package: [pos, kds, assistant, tablet, shop, kiosk]
        include:
          - package: pos
            exe_prefix: "TTPOS"
            scp_folder: "Cashier"
            faynosync_name: "TTPOS"
            cms_title: "Cashier"
          - package: kds
            exe_prefix: "TTPOS-Kitchen"
            scp_folder: "Kitchen"
            faynosync_name: "TTPOS Kitchen"
            cms_title: "KDS Kitchen"
          - package: assistant
            exe_prefix: "TTPOS-Go"
            scp_folder: "Assistant"
            faynosync_name: "TTPOS Go"
            cms_title: "Assistant"
          - package: tablet
            exe_prefix: "TTPOS-Menu"
            scp_folder: "Menu"
            faynosync_name: "TTPOS Menu"
            cms_title: "Tablet Menu"
          - package: shop
            exe_prefix: "TTPOS-Shop"
            scp_folder: "Shop"
            faynosync_name: "TTPOS Shop"
            cms_title: "Shop"
          - package: kiosk
            exe_prefix: "TTPOS-Kiosk"
            scp_folder: "Kiosk"
            faynosync_name: "TTPOS Kiosk"
            cms_title: ""
    env:
      output_path: releases
      SCP_S_PATH: ${{ inputs.branch == 'release' && format('/hitosea/ttpos-windows/Prod/{0}/', matrix.package) || format('/hitosea/ttpos-windows/Test/{0}/', matrix.package) }}
      SCP_D_PATH: ${{ inputs.branch == 'release' && format('/root/web/web/restant/out/downloads/Windows/{0}/', matrix.scp_folder) || format('/root/web/web/restant/out/downloads/Windows/Test/{0}/', matrix.scp_folder) }}
    steps:
      - name: 检查是否需要构建此应用端
        id: check
        shell: pwsh
        run: |
          if ("${{ inputs.package }}" -eq "all" -or "${{ inputs.package }}" -eq "${{ matrix.package }}") {
            echo "should_run=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "跳过 ${{ matrix.package }} (选择的应用端: ${{ inputs.package }})"
            echo "should_run=false" >> $env:GITHUB_OUTPUT
          }

      - name: 显示构建信息
        if: steps.check.outputs.should_run == 'true'
        run: |
          Write-Host "========================================="
          Write-Host "构建信息"
          Write-Host "========================================="
          Write-Host "应用端: ${{ matrix.package }}"
          Write-Host "分支: ${{ inputs.branch }}"
          Write-Host "环境: ${{ inputs.env }}"
          Write-Host "API URL: ${{ inputs.base_url }}"
          Write-Host "WebSocket URL: ${{ inputs.base_ws_url }}"
          Write-Host "SCP传输: ${{ inputs.scp }}"
          Write-Host "========================================="

      - name: Checkout the code
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          repository: innet8/ttpos-flutter
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Setup Flutter
        if: steps.check.outputs.should_run == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
          cache: true

      - name: 配置 MELOS_SDK_PATH
        if: steps.check.outputs.should_run == 'true'
        shell: bash
        run: |
          SDK_PATH=$(dirname "$(dirname "$(command -v flutter)")")
          echo "MELOS_SDK_PATH=$(cygpath -w "$SDK_PATH")" >> "$GITHUB_ENV"

      - name: Install Melos
        if: steps.check.outputs.should_run == 'true'
        run: |
          flutter --version
          dart --version
          dart pub global activate melos

      - name: Melos Init
        if: steps.check.outputs.should_run == 'true'
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
        run: |
          melos bs
          melos run env:setup -- --env=${{ inputs.env }} --file=${{ inputs.env }}

      - name: 生成环境变量文件
        if: steps.check.outputs.should_run == 'true'
        shell: pwsh
        run: |
          $pkgName = "${{ matrix.package }}"
          if (-not $pkgName) {
            Write-Error "错误：包名 (package) 为空."
            exit 1
          }

          # 根据 env 输入选择对应的环境文件(与 scripts/utils.dart getEnv() 保持一致)
          $envSuffix = switch ("${{ inputs.env }}") {
            "dev"  { "development" }
            "test" { "test" }
            default { "production" }
          }

          $envDir = "apps/$pkgName"
          $envPath = "$envDir/.env.$envSuffix.local"
          $envTemplate = "$envDir/.env.$envSuffix"

          if (-not (Test-Path $envPath)) {
            if (Test-Path $envTemplate) {
              Copy-Item $envTemplate $envPath
            } else {
              New-Item -ItemType File -Path $envPath -Force
            }
          }

          $api_url = "${{ inputs.base_url }}"
          $ws_url = "${{ inputs.base_ws_url }}"

          (Get-Content $envPath) -replace '^API_BASE_URL=.*', "API_BASE_URL=$api_url" | Set-Content $envPath
          (Get-Content $envPath) -replace '^WS_BASE_URL=.*', "WS_BASE_URL=$ws_url" | Set-Content $envPath

          $updater_url = "${{ inputs.updater_url }}"
          $updater_owner = "${{ inputs.updater_owner }}"
          $updater_channel = "${{ inputs.updater_channel }}"

          foreach ($pair in @(@("UPDATER_URL", $updater_url), @("UPDATER_OWNER", $updater_owner), @("UPDATER_CHANNEL", $updater_channel))) {
            $key = $pair[0]; $val = $pair[1]
            if ($val) {
              $content = Get-Content $envPath -Raw
              if ($content -match "(?m)^$key=") {
                (Get-Content $envPath) -replace "^$key=.*", "$key=$val" | Set-Content $envPath
              } else {
                Add-Content $envPath "$key=$val"
              }
            }
          }

          # 保存 envSuffix 供后续步骤使用
          echo "ENV_SUFFIX=$envSuffix" >> $env:GITHUB_ENV

          Write-Host "--- 环境变量文件内容 ($envPath) ---"
          Get-Content $envPath

      - name: 设置 SENTRY_DSN(仅 release 分支)
        if: steps.check.outputs.should_run == 'true' && inputs.branch == 'release'
        shell: pwsh
        run: |
          $envPath = "apps/${{ matrix.package }}/.env.${{ env.ENV_SUFFIX }}.local"
          $dsn = switch ("${{ matrix.package }}") {
            "pos" { "${{ secrets.SENTRYDSN_POS }}" }
            "assistant" { "${{ secrets.SENTRYDSN_ASSISTANT }}" }
            "tablet" { "${{ secrets.SENTRYDSN_TABLET }}" }
            "kds" { "${{ secrets.SENTRYDSN_KDS }}" }
            "shop" { "${{ secrets.SENTRYDSN_SHOP }}" }
            "kiosk" { "${{ secrets.SENTRYDSN_KIOSK }}" }
            default { "" }
          }
          if ($dsn -ne "") {
            (Get-Content $envPath) -replace '^SENTRY_DSN=.*', "SENTRY_DSN=$dsn" | Set-Content $envPath
            Write-Host "已设置 SENTRY_DSN 到 $envPath"
          }

      - name: 设置环境变量
        if: steps.check.outputs.should_run == 'true'
        run: |
          $env:MELOS_PACKAGE_NAME = "${{ matrix.package }}"
          $version = (Get-Content apps/${{ matrix.package }}/pubspec.yaml | Select-String 'version:' | ForEach-Object { $_.Line.Split(':')[1].Trim() }).Split('+')[0]
          $env:MELOS_PACKAGE_VERSION = $version
          echo "MELOS_PACKAGE_NAME=$env:MELOS_PACKAGE_NAME" >> $env:GITHUB_ENV
          echo "MELOS_PACKAGE_VERSION=$env:MELOS_PACKAGE_VERSION" >> $env:GITHUB_ENV

      - name: 检查 FaynoSync 版本是否已存在
        if: steps.check.outputs.should_run == 'true' && inputs.faynosync == 'on'
        shell: bash
        env:
          FAYNOSYNC_URL: ${{ secrets.FAYNOSYNC_URL }}
        run: |
          if [ -z "$FAYNOSYNC_URL" ]; then
            echo "::warning::未配置 FAYNOSYNC_URL，跳过 FaynoSync 版本检查"
            exit 0
          fi

          APP_NAME="${{ matrix.faynosync_name }}"
          CHANNEL="${{ inputs.env }}"
          CHECK_VERSION="${{ env.MELOS_PACKAGE_VERSION }}"
          PLATFORM="windows"
          ARCH="amd64"

          echo "检查 FaynoSync: ${APP_NAME} v${CHECK_VERSION} (${CHANNEL}/${PLATFORM}/${ARCH})"

          RESP=$(curl -s --max-time 10 -G "${FAYNOSYNC_URL}/checkVersion" \
            --data-urlencode "app_name=${APP_NAME}" \
            --data-urlencode "version=${CHECK_VERSION}" \
            --data-urlencode "channel=${CHANNEL}" \
            --data-urlencode "platform=${PLATFORM}" \
            --data-urlencode "arch=${ARCH}" \
            --data-urlencode "owner=ttpos")

          UPDATE=$(echo "$RESP" | jq -r '.update_available // "null"')

          if [ "$UPDATE" = "false" ]; then
            VERIFY=$(curl -s --max-time 10 -G "${FAYNOSYNC_URL}/checkVersion" \
              --data-urlencode "app_name=${APP_NAME}" \
              --data-urlencode "version=0.0.0" \
              --data-urlencode "channel=${CHANNEL}" \
              --data-urlencode "platform=${PLATFORM}" \
              --data-urlencode "arch=${ARCH}" \
              --data-urlencode "owner=ttpos")

            VERIFY_UPDATE=$(echo "$VERIFY" | jq -r '.update_available // "null"')

            if [ "$VERIFY_UPDATE" = "true" ]; then
              echo "::error::FaynoSync 已存在 ${APP_NAME} v${CHECK_VERSION} (${CHANNEL}/${PLATFORM}/${ARCH})，跳过构建。如需强制覆盖，请选择 faynosync=force"
              exit 1
            fi
          fi

          echo "FaynoSync 检查通过，继续构建"

      - name: 构建 Windows 安装包
        if: steps.check.outputs.should_run == 'true'
        run: |
          dart run ./scripts/build_win_innosetup.dart --env=${{ inputs.env }} --package=${{ matrix.package }}

      - name: 检查构建产物
        if: steps.check.outputs.should_run == 'true'
        run: |
          $exeName = "${{ matrix.exe_prefix }}-$env:MELOS_PACKAGE_VERSION.exe"
          $exePath = ".\releases\${{ matrix.package }}\$env:MELOS_PACKAGE_VERSION\$exeName"
          if (-not (Test-Path $exePath)) {
            Write-Error "未找到构建产物: $exePath"
            exit 1
          }
          Write-Host "构建产物存在: $exePath"
          $fileInfo = Get-Item $exePath
          Write-Host "文件大小: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"

      - name: 上传构建产物到 Artifact
        if: steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.exe_prefix }}-${{ env.MELOS_PACKAGE_VERSION }}
          path: releases/${{ matrix.package }}/${{ env.MELOS_PACKAGE_VERSION }}/
          retention-days: 7
          compression-level: 0

      - name: SCP-UPLOAD
        if: steps.check.outputs.should_run == 'true' && inputs.scp == 'on'
        uses: Comori/ssh@v0.0.7
        with:
          host: ${{ secrets.SCP_S_HOST }}
          username: ${{ secrets.SCP_S_USER }}
          privateKey: ${{ secrets.SCP_S_RIVATEKEY }}
          command: |
            mkdir -p ${{ env.SCP_S_PATH }}
            # 传输到最终服务器
            scp -o StrictHostKeyChecking=no ${{ env.SCP_S_PATH }}${{ matrix.exe_prefix }}-${{ env.MELOS_PACKAGE_VERSION }}.exe ${{ secrets.SCP_D_USER }}@${{ secrets.SCP_D_HOST }}:${{ env.SCP_D_PATH }}
          sourceFiles: |
            releases/${{ matrix.package }}/${{ env.MELOS_PACKAGE_VERSION }}/${{ matrix.exe_prefix }}-${{ env.MELOS_PACKAGE_VERSION }}.exe
          targetDir: ${{ env.SCP_S_PATH }}
          scpFirst: true

      - name: Create latest symlink
        if: steps.check.outputs.should_run == 'true' && inputs.scp == 'on'
        uses: Comori/ssh@v0.0.7
        with:
          host: ${{ secrets.SCP_S_HOST }}
          username: ${{ secrets.SCP_S_USER }}
          privateKey: ${{ secrets.SCP_S_RIVATEKEY }}
          command: |
            # 在最终服务器创建软链
            ssh -o StrictHostKeyChecking=no ${{ secrets.SCP_D_USER }}@${{ secrets.SCP_D_HOST }} "mkdir -p ${{ env.SCP_D_PATH }} && cd ${{ env.SCP_D_PATH }} && ln -sf ${{ matrix.exe_prefix }}-${{ env.MELOS_PACKAGE_VERSION }}.exe ${{ matrix.exe_prefix }}-latest.exe"
            echo "Created symlink: ${{ matrix.exe_prefix }}-latest.exe -> ${{ matrix.exe_prefix }}-${{ env.MELOS_PACKAGE_VERSION }}.exe"

      - name: 上传到 FaynoSync
        id: faynosync
        if: steps.check.outputs.should_run == 'true' && inputs.faynosync != 'off'
        continue-on-error: true
        shell: bash
        env:
          FAYNOSYNC_URL: ${{ secrets.FAYNOSYNC_URL }}
          FAYNOSYNC_TOKEN: ${{ secrets.FAYNOSYNC_TOKEN }}
        run: |
          FILE_PATH="releases/${{ matrix.package }}/${{ env.MELOS_PACKAGE_VERSION }}/${{ matrix.exe_prefix }}-${{ env.MELOS_PACKAGE_VERSION }}.exe"
          if [ ! -f "$FILE_PATH" ]; then
            echo "构建产物不存在，跳过 FaynoSync 上传"
            exit 0
          fi

          if [ -z "$FAYNOSYNC_URL" ] || [ -z "$FAYNOSYNC_TOKEN" ]; then
            echo "未配置 FAYNOSYNC_URL 或 FAYNOSYNC_TOKEN，跳过上传"
            exit 0
          fi

          CHANNEL="${{ inputs.env }}"

          echo "上传到 FaynoSync: ${{ matrix.faynosync_name }} v${{ env.MELOS_PACKAGE_VERSION }} (${CHANNEL}/windows/amd64)"
          HTTP_CODE=$(curl -s -o /tmp/faynosync_resp.json -w "%{http_code}" -X POST "${FAYNOSYNC_URL}/upload" \
            -H "Authorization: Bearer ${FAYNOSYNC_TOKEN}" \
            -F "file=@${FILE_PATH}" \
            -F "data={\"app_name\":\"${{ matrix.faynosync_name }}\",\"version\":\"${{ env.MELOS_PACKAGE_VERSION }}\",\"channel\":\"${CHANNEL}\",\"publish\":false,\"critical\":false,\"platform\":\"windows\",\"arch\":\"amd64\",\"changelog\":\"Build from ${{ inputs.branch }}\"}")
          RESP=$(cat /tmp/faynosync_resp.json 2>/dev/null)
          echo "HTTP ${HTTP_CODE}: ${RESP}"
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::FaynoSync 上传失败 (HTTP ${HTTP_CODE}): ${RESP}"
            exit 1
          fi
          echo "uploaded=true" >> $GITHUB_OUTPUT
          echo "FaynoSync 上传完成"

      - name: 更新 CMS 下载页
        if: >-
          steps.check.outputs.should_run == 'true'
          && inputs.update_cms == true
          && steps.faynosync.outputs.uploaded == 'true'
          && matrix.cms_title != ''
        continue-on-error: true
        shell: bash
        env:
          STRAPI_URL: https://cms.hitosea.com
          STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
          FAYNOSYNC_URL: ${{ secrets.FAYNOSYNC_URL }}
          FAYNOSYNC_TOKEN: ${{ secrets.FAYNOSYNC_TOKEN }}
          CMS_PLATFORM: windows
          CMS_ARCH: amd64
          CMS_PKG_FMT: exe
          CMS_PLATFORM_LABEL: Windows
          CMS_TITLE: ${{ matrix.cms_title }}
          CMS_VERSION: ${{ env.MELOS_PACKAGE_VERSION }}
        run: |
          if [ -z "$STRAPI_TOKEN" ]; then
            echo "::warning::未配置 STRAPI_TOKEN，跳过 CMS 更新"
            exit 0
          fi

          CHANNEL="${{ inputs.env }}"

          # 从 FaynoSync 获取下载链接（使用 --data-urlencode 处理含空格的 app_name）
          DOWNLOAD_URL=$(curl -s -o /dev/null -w "%{redirect_url}" -G \
            "${FAYNOSYNC_URL}/apps/latest" \
            --data-urlencode "app_name=${{ matrix.faynosync_name }}" \
            --data-urlencode "channel=${CHANNEL}" \
            --data-urlencode "platform=${CMS_PLATFORM}" \
            --data-urlencode "arch=${CMS_ARCH}" \
            --data-urlencode "package=${CMS_PKG_FMT}" \
            --data-urlencode "owner=ttpos")

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::warning::无法从 FaynoSync 获取下载链接，跳过 CMS 更新"
            exit 0
          fi

          echo "获取到下载链接: ${DOWNLOAD_URL}"

          POPULATE="populate[items][populate][downloadButton]=*&populate[items][populate][downloadButtons]=*&populate[items][populate][thumbnail]=*&populate[items][populate][platforms]=*"

          CMS_DATA=$(curl -s \
            "${STRAPI_URL}/api/tt-pos-download?locale=en&${POPULATE}" \
            -H "Authorization: Bearer ${STRAPI_TOKEN}")

          if ! echo "$CMS_DATA" | jq -e '.data.attributes.items' > /dev/null 2>&1; then
            echo "::warning::无法获取 CMS 数据，跳过"
            exit 0
          fi

          HAS_MATCH=$(echo "$CMS_DATA" | jq --arg title "$CMS_TITLE" \
            '[.data.attributes.items[] | select(.title == $title)] | length')

          if [ "$HAS_MATCH" = "0" ]; then
            echo "::warning::CMS 中未找到 ${CMS_TITLE}，跳过"
            exit 0
          fi

          UPDATED=$(echo "$CMS_DATA" | jq \
            --arg url "$DOWNLOAD_URL" \
            --arg ver "V${CMS_VERSION}" \
            --arg date "$(date +%Y-%m-%d)" \
            --arg label "$CMS_PLATFORM_LABEL" \
            --arg title "$CMS_TITLE" \
            '
            .data.attributes |
            del(.createdAt, .updatedAt, .publishedAt, .locale) |
            .localizations = [.localizations.data[]?.id] |
            .items |= map(
              .thumbnail = (if .thumbnail and .thumbnail.data then .thumbnail.data.id else null end) |
              .platforms = [.platforms[]? | {label}] |
              .downloadButton = (if .downloadButton then {label: .downloadButton.label, href: .downloadButton.href, target: .downloadButton.target} else null end) |
              .downloadButtons = [.downloadButtons[]? | {label, href, target}] |
              if .title == $title then
                .version = $ver |
                .releasedAt = $date |
                (.downloadButtons |= map(
                  if .label == $label then .href = $url else . end
                ))
              else . end
            ) |
            { data: . }
            ')

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "${STRAPI_URL}/api/tt-pos-download?locale=en" \
            -H "Authorization: Bearer ${STRAPI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$UPDATED")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "CMS 更新成功 (HTTP ${HTTP_STATUS})"
          else
            echo "::warning::CMS 更新失败 (HTTP ${HTTP_STATUS})"
          fi

      - name: 构建完成总结
        if: always() && steps.check.outputs.should_run == 'true'
        run: |
          Write-Host "========================================="
          Write-Host "构建任务完成"
          Write-Host "========================================="
          Write-Host "应用端: ${{ matrix.package }}"
          Write-Host "版本: $env:MELOS_PACKAGE_VERSION"
          Write-Host "分支: ${{ inputs.branch }}"
          Write-Host "环境: ${{ inputs.env }}"
          Write-Host "========================================="
